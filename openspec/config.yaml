schema: spec-driven

context: |
  Project: Uplift (personal immersive simulation game to share locally with friends — not a commercial cloud product).

  Concept, Setting & Multi-Epoch Continuity:
  - Inspired by Iain M. Banks' Culture novels (*Inversions*, *Matter*, *Use of Weapons* / Special Circumstances), Fred Saberhagen's *Brother Assassin*, and Strugatsky's *Hard to Be a God*.
  - **Terminology (`Epoch === Era`) & Data-Driven $N$-Epoch Ladder (`EpochProfileBlueprint[]`)**:
      Throughout Uplift, **`Epoch` and `Era` are 100% synonymous** (`Epoch 1 === Era 1`; code and schemas use `epochId`). The **7-Epoch / 7-Era Grand Civilizational Arc** below is the **default data-driven campaign ladder** ($N \ge 1$, where the final entry has `isTerminalEpoch: true`), **never a hardcoded engine constant** — Epochs can be added, removed, split, or reordered in content configuration at any time:
      1. **Epoch 1 (Era 1) — Feudal** (*Highglass Hold*: feudal court, guilds, Synod orthodoxy, horse couriers, naked-eye omens, Witch-Hunt Inquisition)
      2. **Epoch 2 (Era 2) — Renaissance** (printing charters, optical lenses, merchant banking houses, humanist inquiry vs. dogmatic rifts)
      3. **Epoch 3 (Era 3) — Pre-Industrial / Colonial** (chartered trading companies, optical semaphore & post networks, navigational observatories, mercantilist resource wars)
      4. **Epoch 4 (Era 4) — Industrial / WWI-Equivalent** (steam/coal/rail, telegraph wires, mass conscription, factory labor vs. capital, industrial/chemical warfare dual-use ceilings)
      5. **Epoch 5 (Era 5) — Cold-War-Era Equivalent** (ideological blocs, radio/television/CRT, nuclear/strategic deterrence dual-use ceilings, intelligence agencies & black-sites)
      6. **Epoch 6 (Era 6) — Computer-Age** (global digital networks, email/cloned ledger hashes, algorithmic surveillance, corporate/state information monopolies)
      7. **Epoch 7 (Era 7) — Space-Age / First-Contact (`isTerminalEpoch: true`)** (orbital telemetry/satellites, indigenous planetary defense capable of deflecting the Intersecting Comet, culminating in First Contact readiness)
  - The player is a covert Special Circumstances operative implanted into a developing civilization, with **a new playable operative per Epoch** accompanied by two Culture advisor roles who argue inside the neural lace (`AdvisoryDuel`, where a frozen-out advisor sulks and withholds `omissible` briefing clauses) with callsigns/identities and personality traits (`humor`, `patience`, `riskTolerance`, `primness`, `omissionSulkThreshold`) rolled or selected within bounded ranges per Epoch:
      1. The orbiting Ship Mind (`advisor_integral`, e.g. seed exemplar *"The Ending"*): consequentialist of **The Integral** (area under the curve of lives across generations, non-round probabilities like `0.73`).
      2. The groundside Companion Drone (`advisor_particular`, e.g. seed exemplar *"The Lamp"*): fierce deontologist of **The Particular** (single bodies, hygiene, room smell scored 1-5), forced into an era-appropriate physical disguise (`droneDisguise`) randomly chosen from a curated pool of 3-6 era-appropriate items per Epoch (Feudal reliquary lamp/lantern -> Renaissance astrolabe/chronometer -> Colonial sextant/barometer -> Industrial brass theodolite/telegraph ticker -> Cold-War field-radio/dosimeter -> Computer-Age diagnostic terminal -> Space-Age telemetry drone).
      *(Note: Specific character, ship, drone, and location names in `DESIGN_NOTES.md` are non-exhaustive seed exemplars establishing tone and writing quality; content scales to 500+ characters, multiple regions, and large pools of threads and storylets.)*
  - **Uplift-Compressed Generational Flow & Anti-Over-Acceleration Ceilings (`EpochTechCeilingBlueprint`)**:
      Your covert Uplift presence compresses 600–800 years of natural history into **generational intervals (`15–30 years` between operatives: `4–6 years` of post-climax work before extraction + `11–24 years` before the next operative lands, totaling `~110–200 in-world years` across a 7-Epoch run)** so surviving `youth`/`prime` NPCs from Epoch $k$ are still alive as `prime`/`elder` in adjacent Epoch $k+1$ (`youth -> prime -> elder -> succeeded_by_heir`) and personally remember your predecessor while living through rapid civilizational transformation.
      Strict per-Epoch ceilings (`maxTechTierForEpoch`, `maxMaturationStepPerTransition = 1`, and societal `absorptionCapacity`) guarantee that mechanics compress the *time between Epochs* to match our pacing design without ever skipping an Epoch rung or breaking an Epoch's internal coherence.
      Advancing triggers a 4-panel procedural chiaroscuro **Extraction & Reunion Still Sequence**, runs `runInterEpochMaturation`, exports a `CivilizationLegacyState` snapshot with **Dual Legacy Ledgers** (**Material Scars** vs **Veil Scars**), grafts visible/uncoverable **Predecessor Traces** onto `semanticId` stage walls/props, unlocks expanded landing choices, and lets the new operative choose between **Claiming Kinship (`kin_claim`)** or **Starting Afresh (`fresh_start`)**.

  Visual Style, Camera & Diegetic UI Architecture:
  - 3rd-Person Fixed-Orientation Tracking Camera (*Final Fantasy VII* / *Disco Elysium* / *Inside* style): volume-aware (`CameraVolumeBlueprint`) critically damped spring transitions between wide outdoor courtyards, doorway chokes, and cramped interiors, with subtle camera tilts for Emergency States and Orbital Zenith passes.
  - Dark, serious "stage-paint chiaroscuro" visual style at 60 FPS on a 2019 Intel Mac: stepped 3-band toon/chiaroscuro lighting with `#1a1f28` blue-gray shadows, `-30%` desaturated stone/mud/iron palettes, warm `#c4a574` torch/forge pools, exponential weather/emergency fog, and alpha-cone god-rays.
  - **Diegetic UI Bifurcation**: Tactile era-appropriate surface (Epoch 1: parchment broadsheets, wax seals, linen maps; evolving across Epochs to printed pamphlets, colonial gazettes, telegraph tape, Cold-War dossiers/CRT, computer terminals, and space-age telemetry consoles) contrasted against the **Sub-Retinal Culture Neural Lace** (clean geometric vector arcs, inertia pillar rings, orbital pass windows, and rival spoof indicators).
  - **In-Game Debug Mode (`F3` / backtick), Stage/Wardrobe Labs (Sound Lab planned) & Agent DOM Mirror**:
      Pauses 60Hz kinematics, cognitive pulses, and watch advancement, desaturates the frozen world by 40%, morphs the audio bus into a frozen room-tone grain + 1 Hz lace pulse, de-anchors the camera for free movement, and renders floating state inspector cards over targeted NPCs/props/surfaces.
      Every 3D wall segment, floor, prop, light, and character part carries a deterministic **`semanticId`** (`charnel_stairs.wall.north.seg_02`, `npc.sorrel.part.headgear`) built from the 3-Layer Encoded Visual Framework (`SceneVisualBlueprints.ts`: `EpochVisualTheme` + `StageSceneBlueprint` + `CharacterVisualBlueprint`, starter constants in `defaultStageContent.ts`, and parametric builders in `StageKitbashBuilders.ts` & `ChiaroscuroStageRenderer.ts`).
      `StageInspectorDomMirror` mirrors `data-active-space-id`, `data-hovered-semantic-id`, `data-selected-semantic-id`, `data-debug-paused`, `data-camera-mode`, and `globalThis.__UPLIFT_STAGE_INSPECTOR__` so the AI agent can directly inspect the live DOM and take screenshots via `cursor-ide-browser`, and the `F3` Stage/Wardrobe Lab (`GET`/`PUT /api/scene-blueprints/:stageId`, `GET`/`PUT /api/character-visuals/:characterId`) persist live UI tweaks back to `src/content/`. The `F3` Sound Lab (`PUT /api/audio-patches`, planned: 05a-sound-lab) and the `F3` Pacing Lab (`PUT /api/pacing-profiles/:profileId`, planned: 05b-2-storylets-and-lab) will do the same through the guarded bridge write-route helper (planned, built by hx-ops-safety).
  - **Play shell (`05c-play-shell`)**: The single browser page in `src/interfaces/composition/` for the whole campaign. It loads whichever pack is registered, steps the coordinator once per frame, sends waypoint and portal requests, swaps the resident stage when the focus entity changes space, and hosts the F3 stage lab. The proving slice is the first pack it can load. Anything the player must see or interact with, at any point, loads into this page: stages, bodies, cabins, stills, labs, and player-facing controls. The F3 Sound Lab (`05a-sound-lab`, planned), the F3 Pacing Lab (`05b-2-storylets-and-lab`, planned), and travel cabins (`06c`) are later loads, not new pages. Diegetic parchment and the neural lace stay a later player-facing surface on the same page. A character is drawn only when `CharacterVisualBlueprint.characterId` matches the entity id. Until the pack loader exists, an F3 stage-lab save writes JSON the game does not load. Lab JSON is planned to become the source of truth, checked at runtime through `validateLaunch` (planned: pre-05b-pack-source-of-truth).
  - **Direct floor locomotion (planned: 05d-input-and-control-frame, 05d-locomotion-footprint, 05d-arrival-hold-readability)**: The focus operative will walk the current floor with camera-relative WASD at `walkSpeedMetersPerSec`. The body radius will be `0.22` m. Props will block the oriented footprint of their drawn mesh plus `0.03` m. An `open` or `ajar` portal will hop within `0.5` m of the near waypoint when steer aims at the far side. Only the player's disc will hold an NPC short of an arrival: an ambient line at about `6` s, a slide at about `12` s. That line will not open a conversation. NPCs stay on waypoint paths. Depends on `05` and `05c`. [planned - revisable]
  - **Proximity use (planned: 05e-modal-stack-use-and-menu)**: Space will use a target within `0.4` m of its surface and inside `±45°` of facing. The candidate closest to straight ahead will win. WASD, Space, and Escape will drive every menu, and the body will stand still while one is open. Player pause will freeze the room and leave the camera anchored. Other menus will not pause the room. `interactionHold` on `WorldState` will stop the held person or prop so later dialogue can keep that hold. Depends on `05c` and `05d`. [planned - revisable]
  - **Conversation text bubbles (planned: 07-bubble-lace-skins-and-tone-blips)**: An NPC conversation will be a diegetic text bubble. An advisor conversation will be lace text. There is no voice acting. "Voice" in `07e-voice-register-evals` is a written register. The `05a` buses stay non-speech. [planned - revisable]
  - **Conversation paging and ambient lines (planned: 07-dialogue-paging)**: Space will advance any conversation the player enters or a world event opens, one chunk at a time (at most two lines, about `120` characters). A response will be a WASD choice menu confirmed with Space, and the talk then continues or finishes. Ambient lines will be short text on speakers the player has not entered: overheard exchanges, exclamations, and the impatient beat. They will expire, take no input, and not lock the player. Each conversation will charge the fractional time-spend verb that `05b-1-watch-clock-and-time-spend` owns. Depends on `05e` for the menu stack. The impatient trigger is emitted by `05d`. [planned - revisable]
  - **Dialogue interruption (planned: 07a-dialogue-interruption)**: The player will be able to cut a live conversation. Shown chunks will stay in `ConversationHistory`. The unread tail will not fire. Depends on `07`. [planned - revisable]
  - **Role pretext choices (planned: 07b-role-pretext-choices)**: A conversation choice row will be able to spend a held role pretext and dispatch that row's effect. Depends on `07` and the office pretext registry. [planned - revisable]
  - **Fund spending choices (planned: 07c-fund-spending-choices)**: A conversation choice row will be able to spend a fund and dispatch that row's effect. Depends on `07` and the fund instruments. [planned - revisable]
  - **Advisory duel omission (planned: 07d-advisory-duel-omission)**: Freezing out `advisor_integral` or `advisor_particular` will make that advisor sulk and drop an `omissible` clause. The lace page stays `07`. Depends on `07`. [planned - revisable]
  - **Local AI eval framework (planned: 05f-eval-and-replay)**: One offline runner, `eval/` via `npm run eval:ai`, will score every AI subject. A case will be a fixture, a fixed seed, a fast-eval rollout, and assertions. The command stays outside `npm run verify`. The first case rolls the shipped headless simulation. Utility and rival cases register on `06`, and written-register cases on `07e`. The text-pipeline gate and generation suites register once the text port exists (`07-text-port-and-history`, `08-generated-text-adapter`). Depends on archived `03` and `05`. [planned - revisable]
  - **Voice-register evals (planned: 07e-voice-register-evals)**: A suite on the `05f` runner: golden fixtures for banned lemmas, cadence, and clause omission. Depends on `05f`, `07`, and `07d`. "Voice" is a written register. [planned - revisable]

  Sound Design, Gameplay Acoustics & Procedural Web Audio:
  - **Two-Bus Split**: Wet, room-convolved **Groundside Bus** (environmental beds, surface-aware footsteps, portal occlusion, *The Lamp's* physical bronze chain) vs. bone-dry **Sub-Retinal Culture Neural Lace Bus** (non-speech cues for `advisor_integral` and `advisor_particular`: 12 dB clause-omission dropouts, 174 Hz `zenith` carrier, `occluded` bit-drops, and `Burn` sky-omen harmonic leaks). Advisor lines are lace text, not the conversation bubble and not this bus.
  - **Shared Audibility & Stealth Formula**: `audibility = loudness * distanceFalloff(earshotRadiusMeters) * portalTransmission(open|ajar|closed|barred) * (1 - localMask)` governs both player mix and NPC/Rival eavesdropping.
  - **100% Procedural Web Audio API + Live Sound Lab**: Zero large `.wav` assets in git; all sounds are generated via native Web Audio synthesis from Zod-validated `ProceduralAudioPatch` presets (`src/content/audio/patches.json`) editable both by agent prompts and (planned: 05a-sound-lab) via the `F3` Sound Lab Backdoor UI (`PUT /api/audio-patches`, through the guarded bridge write-route helper, planned, built by hx-ops-safety).

  Hardware & Local-Only Constraints (non-negotiable):
  - Target baseline hardware: 2019 Intel Core i7 MacBook Pro, 16GB RAM (macOS / cross-platform browser & desktop).
  - 100% local execution after `git clone` and `npm install`. A local model cache under `./public/models/` is planned for the text-generation worker and is gated on the timing spike (planned: 08a-timing-spike).
  - ZERO external API keys, ZERO paid tokens, and ZERO cloud LLM/inference calls in runtime or tests.
  - There is no free-text player input (P2). A large share of the surfaced text should come from local SLM / Hugging Face generation, not hand-crafted lines. The owner is happy to get help with authoring. Text is produced behind `TextSourcePort`, with a `LineBrief` and a three-tier gate (lexical, grounding, tell compliance) (planned: 08a-timing-spike, 07-text-port-and-history, 08-generated-text-adapter). Rival linguistic tell detection is a deterministic `tellProfile` post-pass, and the sub-millisecond lexical check is gate tier 1. The local text-generation worker (`@huggingface/transformers`, an infrastructure adapter) is planned and gated on the timing spike. Lines are grounded in NPC epistemic memory, drives, contradictions, cadence, and banned lemmas, never generic chatbot prose. See DESIGN_NOTES, Text pipeline (P2).

  Telemetry, Logging, Compaction & Multi-Session Save/Load (non-negotiable):
  - **Telemetry policy (revisable; browser wiring planned: telemetry-wiring)**: The Act log records what happened and is the gameplay record (planned: cm-act-envelope-and-rolls). Telemetry holds crash, warn, frame spikes and hash checkpoints. Decision traces come from replaying the scripted command log with tracing on (planned: 05f-eval-and-replay): log nothing, replay with tracing. Today the infrastructure NDJSON logger writes `./logs/current-session.jsonl` (via Vite local middleware / Node FS) with `timestampIso`, `elapsedSessionMs`, `worldTick`, `level` (`info` | `warn` | `error` | `crash`), `actorId`, `acteeId`, `action`, `inputs`, `effects`, and `reasoning`. The browser game does not feed it yet; it keeps an in-memory log. Browser telemetry will go through the guarded bridge with a crash ring buffer flushed on throw (planned: telemetry-wiring).
  - The logger will never truncate: the previous session rotates into `./logs/prev/` (planned: hx-ops-safety; today a new session still empties both files). A Rolling Compactor compacts older time windows into `./logs/current-session.compacted.jsonl` (auto-compacting when active log exceeds 50 MiB and capping compacted log at 500 MiB, collapsing repetitive `info` routines while preserving 100% of `warn`, `error`, `crash`, player, rival, and AI reasoning events). Query `limit`, `tail` and `count-by`, a newline guard and an `ENOSPC` warning are planned (telemetry-wiring).
  - A dedicated `.agents/skills/uplift-debug/SKILL.md` and `npm run logs:query` CLI assist agents in querying logs and tracing bugs. `.agents/skills/uplift-design-notes/SKILL.md` is the workflow for processing a raw design-note dump into living docs (topic breakdown, three-agent research, approval, integration, coherence assessment). All project agent skills MUST be placed in `.agents/skills/<skill-name>/SKILL.md` and NEVER in `.cursor/skills/`.
  - Multi-session Save/Load persists named session snapshots under `./saves/`.

  Code Architecture (standing directive — do not skip):
  - Clean Architecture layering with strict inward dependency direction:
      interfaces (three, hud, composition, cli) -> application -> domain
      infrastructure (telemetry logger/compactor, save repository; planned: local text-generation worker) -> domain
      content (eras, characters, behaviors, worlds, mechanics) -> domain (for logic/topology) or interfaces/three (for 3D scene blueprints only)
      domain MUST NOT import application, infrastructure, interfaces, content packs, `three`, `@huggingface/transformers`, or DOM/WebGL APIs.
  - Pure Reducer & Typed Plugin State:
      Behaviors and mechanics never mutate `WorldState` in place; they return `WorldEffect[]` applied by a deterministic reducer.
      Custom module state MUST use typed `StateSliceKey<T>` descriptors, never untyped `Record<string, any>`. Planned (hx-slice-store): slices are frozen on write and shared on read (today the store deep-clones), and a descriptor gains an optional schema, version, migrate and a plain-JSON guard; see DESIGN_NOTES, State, saves and pack identity.
      Freeze extension: no new registry kind or effect without content that uses it. Settle the clock model before more time-bearing schema. No deletion. A test in the kind-table change guards this (planned: pre-05b-launch-validation), not prose.
      The rules spine R1 to R8, the seven-primitive core model and the system graph are written in DESIGN_NOTES.md (planned, revisable). This file points at them and does not copy them.
  - Strict TypeScript, ESLint, Prettier & Zero `any` Policy (non-negotiable):
      `tsconfig.json` MUST enforce `"strict": true`, `"noImplicitAny": true`, `"strictNullChecks": true`, `"noUncheckedIndexedAccess": true`, `"exactOptionalPropertyTypes": true`, and `"noImplicitOverride": true`.
      Both implicit `any` and explicit `any` (`: any`, `as any`, `<any>`, `any[]`, `Record<string, any>`) are strictly forbidden across `src/` and `tests/` and enforced by both ESLint (`@typescript-eslint/no-explicit-any`) and `tests/architecture/layer_boundaries.test.ts` during `npm run verify`.
      Prettier formats on save (`.vscode/settings.json`), and Husky + `lint-staged` run ESLint and Prettier on every `git commit`.
  - Determinism:
      `Math.random()` and `Date.now()` are forbidden inside `src/domain/` and `src/content/`. All simulation randomness MUST use the injected `SeededRandom` (Xorshift32) instance. Planned (hx-determinism-harness): the same ban covers `src/application/`, plus `node:*`, `require` and non-literal `import()`; see DESIGN_NOTES, Engineering rules.

  Plug-and-Play Modularity, World Mechanics & Scalable Entity Tiers:
  - Core engine (`src/domain/`, `src/application/`) contains ZERO hardcoded characters, rooms, behaviors, or feudal-only lore. All game content and sub-types register through declarative, epoch-agnostic module contracts (`EpochModuleRegistry`):
      - Characters (`CharacterBlueprint` & `VoiceProfile` (planned)): 3 tiers (`utility_schemer` Tier 1, `role_routine` Tier 2, `ambient_crowd` Tier 3) with `lineageId`, public/private drive contradictions, `emergencyVice`, cadence/tic/banned-lemma rules, and domain-specific **Inertia Pillars** (`InertiaPillar[]`: `doctrine`, `constituency`, `debt`, `temper`, `ignorance`).
      - Rival Spacefaring Operatives (`RivalCivBlueprint`): Autonomous off-world operatives from competing spacefaring civilizations (e.g., *The Tithe* hegemonists, *The Quiet* ascetics, *House Reciprocal* mercantilists) operating on offset orbital clocks, leaving lexical/economic tells, and spoofing or deleting items on the Wider World Overview.
      - Contested Offices, Pretexts & Groundside Economy (`OfficeBlueprint`, `QuietClaimBlueprint`, `IllicitInstrumentType`, `PressureStockType`): Contested offices (`institutionalLineageId`) and deniable Quiet Claims achieved via spent hooks and coalition keys, granting legitimate stipends and socially legal **Pretexts** (`medical_quarantine`, `ideological_censure`, `technical_audit`, `monetary_assay`, `protocol_immunity`) vs. 3 **Illicit Orbital Insertion Modes** (`unbacked_mass_commodity`, `forged_fiat_instrument`, `anachronistic_marvel`) impacting 3 **Societal Pressure Stocks** (`subsistence_pressure`, `production_pressure`, `elite_prestige_pressure`) and 4 discovery layers (`'noticed' | 'assayed' | 'attributed' | 'theorized'`).
      - Wider World Overview & The Communications Desk (`ChannelMediumBlueprint`, `WorldOverviewModule` & `MessageTransitQueue`): Multi-channel news/rumor board (with trust/spoof seams) and time-lagged async correspondence (stationery/credential, seal/cipher, courier tier, enclosures, proxy co-signing) to off-stage core NPCs (`CorrespondentProfile` with misread tables) arriving via Door Knock, Public Posting First, or Silent Wrong Action.
      - Unified Interpersonal `Regard` Web & Manipulative Romantasy (`RegardGraphModule` & `RomanticMotiveBlueprint`): 2-tier hybrid social graph scaling to 500+ interactable on-stage and off-stage characters ($O(1)$ faction/role baseline priors + copy-on-write sparse materialized `RegardEdge`s with `affection`, `respect`, `trust`, `dread`, `obligation`, `exposure`, and `bondKind` plus salience pruning), autonomous NPC-to-NPC/off-stage bonds, relational triangulation & letter co-signing, 2-layer hidden romantic motives discoverable via 6 gameplay channels, and `LineageBondLegacy` continuity across Epochs.
      - Epoch 2+ Interactive Fast-Travel Vignettes (`TravelVignetteCoordinator`, `VehicleKindBlueprint`, `TransitRouteBlueprint`, `EnRouteEncounterTable`, `TravelSurfaceCueBlueprint`): Bounded vehicle-cabin stages (fast travel that is still a Clock-1 scene and a Clock-2 watch spend), fellow passengers, diegetic news, two independent social/news rolls that may mutate trip pretext / origin / destination / wider world, a summary skip that still resolves pending rolls, and small live world-state surface cues on the cabin (mud, extra gazette, empty seat, blackout shutters) — becoming less limited one `travelTechTier` rung at a time. Epoch 1 has no travel vignettes.
      - Last-Resort Assassination, Counter-Assassination & Cover Persecution (`ViolentPlotModule` & `AnomalousSuspectState`): 4 assassination vectors (`drone_instrument`, `local_agent`, `staged_pretext`, `correspondence_enclosure`), counter-assassination weighted by *The Lamp's* `Regard` disposition (`silent_intercept` vs. `noisy_miracle` vs. `hesitation`) and rival operative orbital timing, plus epoch-agnostic `coverPersecutionRisk` (`clear -> rumored -> examined -> charged -> condemned`, skinned per Epoch across the 7-Epoch default ladder from Feudal Witch-Hunt Inquisition -> Renaissance Heresy Tribunal -> Colonial Admiralty Assize -> Industrial Wartime Court-Martial -> Cold-War Black-Site -> Computer-Age Algorithmic Blacklist -> Space-Age Quarantine Hearing) and `extracted_overt` Veil Scars.
      - Slow-Burn Butterfly Threads, Martyrdom & Crises (`TrajectoryThreadBlueprint`): Interconnected threads with obscure early omens, rising Inertia Pillars, Leverage Chains, the *Brother Assassin* Martyrdom/Succession rule (where a substitute martyr enshrines the wrong virtues, and even the right martyr creates a doctrinal rift in the next Epoch), and Crises (wars, plagues, economic shocks) with Dual-Use Ceilings. Leverage Chain (planned: cm-threads-and-pillars): pillars gain `bearsOnThreadId` and `supportedBy`, thread inertia is derived from them, and the player verb is `weaken_support`.
      - Emergency States (`EmergencyStateBlueprint`): Suppresses (and compounds interest on) routine traits while activating crisis verbs, spatial crowd shifts, visible branching fuses, and player-triggered emergency pretexts. `EmergencyRuntime` carries a scope and compounding applies to the scoped group; the fuse is later (planned: cm-ledger-and-emergency, 09-emergency-fuse).
      - Orbital Pass Cycle, Borrowable Time, Weather Control & Blackout Contingencies (`OrbitalPassBlueprint`, `OrbitalPassRuntimeState`, `WeatherControlModule`, `CampaignContingencyScheduler`): Ship pass position (`zenith`, `horizon`, `occluded`) with **Delta** budget for **Slingshot** (arrive early, longer occlusion) and **Burn** (linger at zenith, sky-omen footprint), gating recon, drops, and localized Weather Modification (tracked via Omen Ledger and Ecological Debt), plus conditional late-game **Rival Ship Ambush (`rival_evasive_maneuvers`)** and a 5-event random pool of once-per-playthrough **Orbital Blackout Contingencies** (`solar_flare_interdiction`, `comet_orbital_diversion` with final-epoch `local_mitigation`, `derelict_artifact_quarantine`, `tectonic_caldera_stabilization`, `hegemonic_emission_silence`) governed by stratified anti-clustering epoch caps (`0..2` per Epoch) and mandatory `minCooldownWatches` recovery buffers.

  Real-Time 60 FPS Experience vs 4-Clock Campaign Pacing & Curve Envelopes (50–100 Hour Campaign Architecture):
  - **Clock 1 — 60 FPS Room Embodiment & Perception**: Everything visible to the player (player movement, Tier 1-3 NPC walking/steering at ~1.4 m/s, body/head rotation, swinging doors, reliquary-lamp drone micro-swings, weather particles) runs continuously at 60 FPS (`stepKinematics(dt)`), with ~250ms perception pulses and ~8-12s local cognitive pulses (`deliberating -> moving -> performing_dwell -> cooldown | awaiting_trigger`).
  - **Clock 2 — Campaign Watch & Committed Time-Spend Clock (`elapsedWatches`)**: Macro world time (message transit, office stipends, orbital pass cycles, crisis fuses — rebasing Change 03's `*Tick` fields to `*Watches` in `05b-1-watch-clock-and-time-spend`) runs on integer **Watches** (`SimulationTimeClocks`) advanced by player Committed Time-Spend Actions (Office shifts, Chambers study/rest, courier waits, Travel vignettes) so an **~8–14 hour Epoch** (`50–100 hours` total campaign ÷ $N$ configured Epochs) never burns out in 15 minutes of idle room time. Decision record (planned, see DESIGN_NOTES): `elapsedWatches` is advanced only by `advance_watches`, `worldTick` is an effect serial and never time, and Clock 1 runs on a fixed `1/60` s step.
  - **Clock 3 & Clock 4 — `StorytellerPacingDirector`, Plotline Point-Releases & Slow-Drift NPC Evolution**: Meters Butterfly Thread Point-Releases (`omen -> simmer -> institutional_friction -> crisis_fuse -> resolution`), Compositional Storylets (`StoryletTemplate`), and closed-form NPC drive/`Regard`/`InertiaPillar` drift across 50–100 hours.
  - **Data-Driven Curve Envelopes (`PacingProfileBlueprint`, `CurveEnvelopeSchema`) & `F3` Pacing Lab**: All pacing speeds, tension-and-recovery waveforms, point-release spacing, NPC evolution rates, and storylet densities are defined as declarative control-point envelopes (`progress01 -> value` with wave modulation) editable in `src/content/pacing/*.json` and, once built (planned: 05b-2-storylets-and-lab), live via the `F3` Pacing Lab (`GET`/`PUT /api/pacing-profiles/:profileId`, through the guarded bridge write-route helper, planned, built by hx-ops-safety).
  - **Human-Paced Cognition, Anti-Thundering-Herd & Fast-Eval Pacing Override (non-negotiable)**:
      1. NPCs must never speed-run through multi-step plots at CPU speed during live gameplay. Every behavior progresses through human-paced phases (`deliberating` -> `moving` -> `performing_dwell` -> `cooldown` or `awaiting_trigger` when waiting for the next player-created trigger).
      2. NPC-to-NPC trigger cascades (`enqueue_npc_stimulus`) enforce a digestion delay with exponential hop backoff (`cascadeHopCount` capped by `maxAutonomousCascadeHops`, default `2`) and a staggered token-bucket scheduler (`maxCognitiveEvaluationsPerPulse = 1`) so NPC-to-NPC interactions never cause a thundering herd.
      3. All pacing/cascade limits and watch-gate scales are controlled via `SimulationPacingConfig` (`DEFAULT_GAMEPLAY_PACING_CONFIG` for live play vs. `FAST_EVAL_PACING_CONFIG` with `storytellerMinWatchScale: 0` added in Change `05b` for automated tests and AI evals) so headless tests and evals can simulate a full Epoch in milliseconds.

  Stack & Pinned Versions (verified 2026-10-29 — latest stable & CVE-patched releases, bump deliberately):
  - Node.js LTS: 24.22.2 'Krypton' LTS or 26.13.0 'Lithium' LTS (includes Oct 21, 2026 security patches for CVE-2026-111497, CVE-2026-105482, CVE-2026-105483, CVE-2026-106069, CVE-2026-106074)
  - npm: 12.2.1
  - OpenSpec CLI (`@fission-ai/openspec`): 1.15.0
  - TypeScript (`@typescript/native`): `npm:typescript@7.0.2` (native Go `tsc` binary) + `typescript`: `npm:@typescript/typescript6@6.0.2` (JS AST bridge for `typescript-eslint`)
  - Vite: 8.3.5
  - Vitest: 5.0.5
  - ESLint: 10.13.0 (`@eslint/js`: 10.0.1, `typescript-eslint`: 8.72.1, `eslint-config-prettier`: 10.1.8, `minimatch` override: 11.0.4)
  - Prettier: 3.9.10
  - Husky: 9.1.7 + `lint-staged`: 17.6.0
  - Zod (`zod`): 4.6.7
  - Three.js (`three`): 0.186.1 (`@types/three`: 0.186.0)
  - Hugging Face Transformers (`@huggingface/transformers`): 4.3.2
  - Node types (`@types/node`): 24.19.2

  Planned Atomic Change Sequence: the ordered roadmap, with ids, dependencies and status, lives in `openspec/roadmap.yaml`. It is living and revisable (see the pillars in DESIGN_NOTES.md).

  Evolving Design & Configuration Flexibility (standing directive):
  - `DESIGN_NOTES.md` and `openspec/config.yaml` are living documents. Before proposing any new change, always check `DESIGN_NOTES.md` for new ideas, adjustments, or intermediate changes (like `01a`, `02a`, etc.), and keep all registries and configuration data-driven and epoch-agnostic so mechanics, camera parameters, tick rates, and content sub-types can be tuned, swapped, or carried into future Epochs at any point. The owner pillars P1-P5 are recorded at the top of `DESIGN_NOTES.md`.

  Atomic Task & Commit Strategy (standing directive — "1 Task = 1 Verified Deliverable Commit"):
  - Every OpenSpec change MUST break `tasks.md` into 4 to 6 small, self-contained tasks.
  - Each task MUST touch at most 1-3 source files plus its corresponding test file, compile cleanly, pass `npm run verify`, and map 1:1 to a single Conventional Commit.

  Review Gates (standing directive — do not skip):
  - Post-Propose 3-Subagent Spec Audit Gate (at the end of EVERY /opsx-propose phase, before /opsx-apply):
      After creating proposal.md, specs/*, design.md, and tasks.md, launch three parallel subagents (using Composer 2.5 Fast or Grok 4.7 High Fast) to audit the change artifacts and propose improvements:
      1. Subagent A — Architecture, Adversarial, Determinism & Hardware Audit: Verify Clean Architecture inward layer placement, epoch-agnostic plug-and-play contracts (zero feudal hardcoding in domain), concurrency/immutability/determinism, zero external APIs, and 2019 Intel Mac 60 FPS / <5s verify budgets.
      2. Subagent B — Spec Completeness, DESIGN_NOTES.md Alignment & Task Atomicity Audit: Verify testable WHEN/THEN scenarios (including negative/corruption cases), alignment with DESIGN_NOTES.md and openspec/config.yaml, and confirm tasks.md has 4-6 atomic tasks (1-3 files each) ordered inward-out so every intermediate commit compiles and passes npm run verify.
      3. Subagent C - Game-industry standards compliance, best practices, user-safety, accessibility, gotchas and possible coding-into-a-corner, as well as future-proofing and extensibility.
      Double-check findings, fold verified improvements into the change artifacts, re-run `npx openspec validate "<change>" --strict`, and pause for user review before starting `/opsx-apply`.
  - Pre-Commit Short Self-Review & Per-Subtask 2-Subagent Review Gate (after EVERY subtask, before pausing for user review):
      1. After implementing a subtask and running its `Verify:` command and `npm run verify`, launch a pair of parallel subagents (using Composer 2.5 Fast or Grok 4.7 High Fast) with broad, non-overlapping review briefs on the staged subtask files:
         - Subagent A — Correctness, Logic, Edge Cases & Performance: Audit algorithmic/state-machine logic, boundary/malformed inputs, immutability, determinism, and CPU/memory efficiency.
         - Subagent B — Architecture, Spec/Design Adherence, Types & Test Coverage: Audit Clean Architecture inward boundaries, zero-`any` / Zod conventions, alignment with the change's spec/design, and unit test assertion quality/gaps.
      2. Double-check their findings, fold any verified fixes into the staged subtask, re-run `npm run verify`, and perform a short self-review of `git diff --staged` before pausing for user review and committing.
  - Post-Change 6-Subagent Review Gate (after EVERY change is delivered, before archiving):
      Once all tasks in a change are marked complete, launch 6 parallel review subagents (using Composer 2.5 Fast or Grok 4.7 High Fast) to audit the delivered change across six axes:
      1. Adversarial Review (edge cases, failure modes, concurrency/race conditions, invalid inputs)
      2. Code Adherence & Architecture Review (layer boundaries, zero-`any`, plug-and-play modularity, OpenSpec spec compliance, hierarchical `README.md`/`AGENTS.md` completeness)
      3. Performance Review (2019 Intel Core i7 16GB RAM budget, 60 FPS frame budget, memory allocation/cloning cost, algorithmic complexity)
      4. Testing Review (assertion quality, missing boundary/negative tests, determinism, test execution speed)
      5. Logic & Simulation Integrity Review (mathematical/bitwise correctness, state-transition invariants, off-by-one or reducer bugs)
      6. Adherence to the project's design notes, thematic consistency, and overall coherence of the change.
      Double-check the subagents' findings against the codebase, fix any verified issues in an atomic commit, and re-run `npm run verify`.

  Hierarchical Documentation & Agent Guidance (standing directive — do not skip):
  - Agent Skills Location Rule: All project agent skills MUST live under `.agents/skills/<skill-name>/SKILL.md` and NEVER under `.cursor/skills/` (enforced by `tests/architecture/layer_boundaries.test.ts`).
  - Maintain a two-tier documentation and agent-instruction hierarchy across the repository:
      1. Root `README.md`: High-level project overview, hardware/offline constraints, pinned dependency & CVE manifest, running/verification instructions, and a Directory Map linking to each section's `README.md`.
      2. Root `AGENTS.md`: Global agent workflow, `/verify` loop, atomic commit policy, layer overview, and an Agent Map linking to each section's `AGENTS.md`.
      3. Per-Section `README.md` & `AGENTS.md`: Every major codebase section (`src/domain/`, `src/application/`, `src/infrastructure/`, `src/content/`, `src/interfaces/`, and `tests/`) MUST maintain its own `README.md` (human-facing responsibilities, contracts, and module inventory) and `AGENTS.md` (agent-facing guardrails, allowed/forbidden imports, step-by-step extension recipes for plugins/content, and test patterns).
  - `tests/architecture/layer_boundaries.test.ts` MUST verify that root `README.md` and `AGENTS.md` exist and link to all section `README.md` and `AGENTS.md` files, and that every major section contains both files.
  - Whenever a change adds or modifies modules in a section, its final task MUST update the corresponding section's `README.md` and `AGENTS.md` (and root index links if new sections were added).

rules:
  proposal:
    - "Before proposing a change, review the project's README.md, AGENTS.md, and DESIGN_NOTES.md to ensure consistency with project scope, context, and design notes (or propose updates to DESIGN_NOTES.md if needed)"
    - "Before proposing a change, review the project's pinned-versions table, planned atomic change sequence, hierarchical documentation rules, and review gates"
    - "Include a Non-goals section to keep the change small and atomic"
    - "State dependencies on prior changes in the change sequence"
    - "Explicitly state that runtime and tests require zero external API keys or cloud inference"
    - "Describe how new modules plug into epoch-agnostic registries without modifying core domain loop code or hardcoding feudal-only assumptions"
  specs:
    - "Specify observable domain, simulation, telemetry, or rendering behavior using testable WHEN/THEN scenarios"
    - "Enforce inward Clean Architecture boundaries, strict TypeScript (no implicit or explicit any), and deterministic SeededRandom behavior where applicable"
  design:
    - "Include the pinned-versions table verified on 2026-10-29 (including CVE-patched runtime/package versions)"
    - "Document layer placement (domain, application, infrastructure, interfaces, content) for every new module"
    - "Ensure 3D presentation data (StageSceneBlueprint) never leaks into src/domain/"
    - "Detail verification commands and headless testing strategy (no WebGL or model load required in fast unit tests)"
    - "Specify which section README.md and AGENTS.md files are created or updated by the change"
  tasks:
    - "Limit each change to 4-6 atomic tasks achievable within a single session"
    - "Enforce the 1 Task = 1 Verified Commit rule where every task checkbox includes an explicit Verify command and a Commit Conventional Commit message"
    - "Order tasks inward-out (domain -> application -> content/infrastructure/interfaces -> docs/verify) so every intermediate commit compiles and passes npm run verify"
    - "End each change with a documentation, verification, and 6-subagent review task (adversarial, code adherence, performance, testing, logic, design adherence) that updates root and per-section README.md and AGENTS.md files"
    - "After creating tasks.md and completing all planning artifacts, run the mandatory Post-Propose 3-Subagent Spec Audit (Architecture/Adversarial/Hardware + Spec/DESIGN_NOTES/Task-Atomicity + Game-Industry Standards/Safety/Accessibility/Extensibility) and fold verified improvements into the artifacts before starting /opsx-apply"

operations:
  propose:
    guidance:
      - "Before proposing a change, review the project's DESIGN_NOTES.md to ensure the change is consistent with the project's design notes or propose changes to the design notes if necessary"
      - "Before proposing a change, review the project's planned atomic change sequence to ensure the change is consistent with the project's planned atomic change sequence or propose changes to the planned atomic change sequence if necessary"
      - "Before proposing a change, review the project's hierarchical documentation rules to ensure the change is consistent with the project's hierarchical documentation rules or propose changes to the hierarchical documentation rules if necessary"
      - "Before proposing a change, review the project's review gates to ensure the change is consistent with the project's review gates or propose changes to the review gates if necessary"
      - "Before proposing a change, review the project's operations to ensure the change is consistent with the project's operations or propose changes to the operations if necessary"
      - "After proposing a change and creating all planning artifacts, run three parallel subagents (using Composer 2.5 Fast or Grok 4.7 High Fast) to audit: (1) Architecture, Adversarial Edge-Cases, Determinism & Hardware Budget, (2) Spec Completeness, DESIGN_NOTES.md Alignment & Task Atomicity (inward-out ordering, 1 task = 1 green commit), and (3) game-industry standards, best practices, user-safety, accessibility, gotchas and possible coding-into-a-corner, as well as future-proofing and extensibility, and after review, fold verified improvements into the artifacts and pause for user review before /opsx-apply"
  apply:
    guidance:
      - "Execute one task at a time by implementing the task, running its Verify command and npm run verify, running a 2-subagent review (Subagent A: Correctness, Logic, Edge Cases & Performance; Subagent B: Architecture, Spec/design Adherence, Types & Test Coverage) and folding in verified fixes, performing a short pre-commit self-review of git diff --staged, then pausing to allow user to review changes"
      - "create an atomic git commit with a conventional commit message, and mark it - [x] in tasks.md before starting the next task"
      - "Never weaken architecture boundary tests, never use implicit or explicit any, and never use raw Math.random() in src/domain/"
      - "Keep per-section README.md and AGENTS.md files in sync with the modules and conventions introduced in that section"
      - "After all tasks in a change are delivered, run the mandatory 6-subagent review (adversarial, code adherence, performance, testing, logic, design adherence)on the commits in the change, double-check their findings, and commit any verified fixes. run all repository tests (omit AI eval tests if not relevant), and npx verify before concluding"
  archive:
    guidance:
      - "Confirm npm run verify passes, the 6-subagent post-change review has been completed and addressed, and all task commits are clean before archiving"
      - "Confirm root and per-section README.md and AGENTS.md files accurately reflect the completed change before archiving"
