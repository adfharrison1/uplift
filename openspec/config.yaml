schema: spec-driven

context: |
  Project: Uplift (personal immersive simulation game to share locally with friends — not a commercial cloud product).

  Concept, Setting & Multi-Epoch Continuity:
  - Inspired by Iain M. Banks' Culture novels (*Inversions*, *Matter*, *Use of Weapons* / Special Circumstances), Fred Saberhagen's *Brother Assassin*, and Strugatsky's *Hard to Be a God*.
  - The player is an immortal covert operative (**Deme**, operating in Era 1 under the cover **Ellin Quell**) implanted into a pre-industrial society (Era 1: **Highglass Hold**, a volcanic-glass gorge crossing between the Synod of Unbroken Sight, the Iron Marches, the Free Port of Brackwell, the Low Fen Confederation, and the Sovereign's Winter Court).
  - Accompanied by two persistent Culture personalities who argue inside the neural lace (`AdvisoryDuel`, where a frozen-out advisor sulks and withholds `omissible` briefing clauses):
      1. The orbiting Ship Mind (**GCU *I Have Read Your Diary And The Ending Is Fine* — "The Ending"**): theatrical consequentialist of **The Integral** (area under the curve of lives across centuries, non-round probabilities like `0.73`).
      2. The groundside Companion Drone (**Hesje-Tuom Fohristi — "The Lamp"**): fierce deontologist of **The Particular** (single bodies, hygiene, room smell scored 1-5), forced into an era-appropriate physical disguise (`droneDisguise`: a bronze chapel reliquary lamp in Era 1; evolving into new instruments in later Epochs).
  - **Multi-Epoch Flow (Epoch-Agnostic Abstractions -> Era-Specific Content)**:
      Each playable slice represents a distinct historical age (Generation/Epoch Jump). Every domain system MUST use epoch-agnostic abstractions (`institutionalLineageId`, `IllicitInstrumentType`, `PressureStockType`, `InertiaPillar`, `ChannelMediumBlueprint`, `EmergencyStateModule`) bound to era-specific content in `src/content/eras/`.
      Advancing exports a `CivilizationLegacyState` snapshot with **Dual Legacy Ledgers** — **Material Scars** (economic/institutional structures, e.g., who owns the gorge communications backbone, guild secrecy vs open charters) and **Veil Scars** (epistemic/cultural contamination, e.g., enshrined martyr ethos, doctrinal rifts, anachronistic relics, rival alien footprints) — plus character/institutional lineage mutations (`lineageId`) that seed the next Epoch.

  Visual Style, Camera & Diegetic UI Architecture:
  - 3rd-Person Fixed-Orientation Tracking Camera (*Final Fantasy VII* / *Disco Elysium* / *Inside* style): volume-aware (`CameraVolumeBlueprint`) critically damped spring transitions between wide outdoor courtyards, doorway chokes, and cramped interiors, with subtle camera tilts for Emergency States and Orbital Zenith passes.
  - Dark, serious "stage-paint chiaroscuro" visual style at 60 FPS on a 2019 Intel Mac: stepped 3-band toon/chiaroscuro lighting with `#1a1f28` blue-gray shadows, `-30%` desaturated stone/mud/iron palettes, warm `#c4a574` torch/forge pools, exponential weather/emergency fog, and alpha-cone god-rays.
  - **Diegetic UI Bifurcation**: Tactile era-appropriate surface (Era 1: parchment broadsheets, wax seals, linen maps; evolving per Epoch) contrasted against the **Sub-Retinal Culture Neural Lace** (clean geometric vector arcs, inertia pillar rings, orbital pass windows, and rival spoof indicators).
  - **In-Game Debug Mode (`F3` / backtick)**: Pauses 60Hz kinematics and background cognitive ticks, desaturates the frozen world by 40%, de-anchors the camera for free movement, and renders floating state inspector cards over targeted NPCs and props.

  Hardware & Local-Only Constraints (non-negotiable):
  - Target baseline hardware: 2019 Intel Core i7 MacBook Pro, 16GB RAM (macOS / cross-platform browser & desktop).
  - 100% local execution after `git clone`, `npm install`, and `npm run setup-models`.
  - ZERO external API keys, ZERO paid tokens, and ZERO cloud LLM/inference calls in runtime or tests.
  - Local NLP uses a 3-stage hybrid pipeline:
      1. Deterministic Lexical & Pragmatic Extractor (<1ms: negation/prohibition polarity, speaker-target roles, speech act, and rival linguistic tell detection).
      2. Local ONNX Embedding Worker (`@huggingface/transformers` running quantized `Xenova/all-MiniLM-L6-v2`, ~23MB cached in `./public/models/`).
      3. Intent Combiner + Anti-LLM-Speak Period-Voice Composer (grounded strictly in NPC epistemic memory, drives, contradictions, cadence, and banned lemmas — never generic chatbot prose).

  Telemetry, Logging, Compaction & Multi-Session Save/Load (non-negotiable):
  - Every event (player, NPC, rival operative, orbital, system) and every AI action (input, output, utility/NLP reasoning, and withheld `AdvisoryDuel` clauses) MUST be logged to `./logs/current-session.jsonl` (structured NDJSON via Vite local middleware / Node FS) with `timestampIso`, `elapsedSessionMs`, `worldTick`, `level` (`info` | `warn` | `error` | `crash`), `actorId`, `acteeId`, `action`, `inputs`, `effects`, and `reasoning`.
  - Only the latest session log is retained on new session start, and a Rolling Compactor compacts older time windows into `./logs/current-session.compacted.jsonl` (auto-compacting when active log exceeds 50 MiB and capping compacted log at 500 MiB, collapsing repetitive `info` routines while preserving 100% of `warn`, `error`, `crash`, player, rival, and AI reasoning events).
  - A dedicated `.agents/skills/uplift-debug/SKILL.md` and `npm run logs:query` CLI assist agents in querying logs and tracing bugs. All project agent skills MUST be placed in `.agents/skills/<skill-name>/SKILL.md` and NEVER in `.cursor/skills/`.
  - Multi-session Save/Load persists named session snapshots under `./saves/`.

  Code Architecture (standing directive — do not skip):
  - Clean Architecture layering with strict inward dependency direction:
      interfaces (three, hud, composition, cli) -> application -> domain
      infrastructure (onnx worker, telemetry logger/compactor, save repository) -> domain
      content (eras, characters, behaviors, worlds, mechanics) -> domain (for logic/topology) or interfaces/three (for 3D scene blueprints only)
      domain MUST NOT import application, infrastructure, interfaces, content packs, `three`, `@huggingface/transformers`, or DOM/WebGL APIs.
  - Pure Reducer & Typed Plugin State:
      Behaviors and mechanics never mutate `WorldState` in place; they return `WorldEffect[]` applied by a deterministic reducer.
      Custom module state MUST use typed `StateSliceKey<T>` descriptors, never untyped `Record<string, any>`.
  - Strict TypeScript, ESLint, Prettier & Zero `any` Policy (non-negotiable):
      `tsconfig.json` MUST enforce `"strict": true`, `"noImplicitAny": true`, `"strictNullChecks": true`, `"noUncheckedIndexedAccess": true`, `"exactOptionalPropertyTypes": true`, and `"noImplicitOverride": true`.
      Both implicit `any` and explicit `any` (`: any`, `as any`, `<any>`, `any[]`, `Record<string, any>`) are strictly forbidden across `src/` and `tests/` and enforced by both ESLint (`@typescript-eslint/no-explicit-any`) and `tests/architecture/layer_boundaries.test.ts` during `npm run verify`.
      Prettier formats on save (`.vscode/settings.json`), and Husky + `lint-staged` run ESLint and Prettier on every `git commit`.
  - Determinism:
      `Math.random()` and `Date.now()` are forbidden inside `src/domain/` and `src/content/`. All simulation randomness MUST use the injected `SeededRandom` (Xorshift32) instance.

  Plug-and-Play Modularity, World Mechanics & Scalable Entity Tiers:
  - Core engine (`src/domain/`, `src/application/`) contains ZERO hardcoded characters, rooms, behaviors, or feudal-only lore. All game content and sub-types register through declarative, epoch-agnostic module contracts wired in `src/interfaces/composition/`:
      - Characters (`CharacterBlueprint` & `VoiceProfile`): 3 tiers (`utility_schemer` Tier 1, `role_routine` Tier 2, `ambient_crowd` Tier 3) with `lineageId`, public/private drive contradictions, a vice that stays awake during emergencies, cadence/tic/banned-lemma rules, and domain-specific **Inertia Pillars** (`Doctrine`, `Constituency`, `Debt`, `Temper`, `Ignorance`).
      - Rival Spacefaring Operatives (`RivalCivBlueprint`): Autonomous off-world operatives from competing spacefaring civilizations (e.g., *The Tithe* hegemonists, *The Quiet* ascetics, *House Reciprocal* mercantilists) operating on offset orbital clocks, leaving lexical/economic tells, and spoofing or deleting items on the Wider World Overview.
      - Contested Offices, Pretexts & Groundside Economy (`OfficeBlueprint` & `FundsEconomyModule`): Contested offices (`institutionalLineageId`) and deniable Quiet Claims achieved via spent hooks and coalition keys, granting legitimate stipends and socially legal **Pretexts** (`medical_quarantine`, `ideological_censure`, `technical_audit`, `monetary_assay`, `protocol_immunity`) vs. 3 **Illicit Orbital Insertion Modes** (`unbacked_mass_commodity` / Bullion, `forged_fiat_instrument` / Counterfeit, `anachronistic_marvel` / Gems) impacting 3 **Societal Pressure Stocks** (`subsistence_pressure`, `production_pressure`, `elite_prestige_pressure`) and 4 discovery layers (`Noticed`, `Assayed`, `Attributed`, `Theorized`).
      - Wider World Overview & The Communications Desk (`WorldOverviewModule` & `MessageTransitQueue`): Multi-channel news/rumor board (with trust/spoof seams) and time-lagged async correspondence (`ChannelMediumBlueprint`: stationery/credential, seal/cipher, courier tier, enclosures) to off-stage core NPCs (`CorrespondentProfile` with misread tables) arriving via Door Knock, Public Posting First, or Silent Wrong Action.
      - Slow-Burn Butterfly Threads, Martyrdom & Crises (`TrajectoryThreadModule`): Interconnected threads with obscure early omens, rising Inertia Pillars, Leverage Chains, the *Brother Assassin* Martyrdom/Succession rule (where a substitute martyr enshrines the wrong virtues, and even the right martyr creates a doctrinal rift in the next Epoch), and Crises (wars, plagues, economic shocks) with Dual-Use Ceilings.
      - Emergency States (`EmergencyStateModule`): Suppresses (and compounds interest on) routine traits while activating crisis verbs, spatial crowd shifts, visible branching fuses, and player-triggered emergency pretexts.
      - Orbital Pass Cycle, Borrowable Time & Weather Control (`OrbitalPassModule` & `WeatherControlModule`): Ship pass position (`zenith`, `horizon`, `occluded`) with **Delta** budget for **Slingshot** (arrive early, longer occlusion) and **Burn** (linger at zenith, sky-omen footprint), gating recon, drops, and localized Weather Modification (tracked via Omen Ledger and Ecological Debt).

  Real-Time 60 FPS Experience vs Background Cognitive Ticks (Human-Paced & Anti-Thundering-Herd):
  - Everything visible to the player (player movement, Tier 1-3 NPC walking/steering at ~1.4 m/s, body/head rotation, swinging doors, reliquary-lamp drone micro-swings, weather particles) runs continuously at 60 FPS (`stepKinematics(dt)`).
  - Perception & arrival pulses run every ~250ms (line-of-sight, acoustic earshot, waypoint arrival events).
  - Cognitive & macro-world ticks run every ~8-12s in the background (Utility AI with +0.15 hysteresis commitment bonus, rumor decay, message transit, orbital pass movement), assigning new target paths without ever teleporting or freezing physical entities.
  - **Human-Paced Cognition, Anti-Thundering-Herd & Fast-Eval Pacing Override (non-negotiable)**:
      1. NPCs must never speed-run through multi-step plots at CPU speed during live gameplay. Every behavior progresses through human-paced phases (`deliberating` -> `moving` -> `performing_dwell` -> `cooldown` or `awaiting_trigger` when waiting for the next player-created trigger).
      2. NPC-to-NPC trigger cascades (`enqueue_npc_stimulus`) enforce a digestion delay with exponential hop backoff (`cascadeHopCount` capped by `maxAutonomousCascadeHops`, default `2`) and a staggered token-bucket scheduler (`maxCognitiveEvaluationsPerPulse = 1`) so NPC-to-NPC interactions never cause a thundering herd.
      3. All pacing/cascade limits are controlled via `SimulationPacingConfig` (`DEFAULT_GAMEPLAY_PACING_CONFIG` for live play vs. `FAST_EVAL_PACING_CONFIG` for automated tests and AI evals) so headless tests and evals can bypass or scale down human timers and thundering-herd throttles to run 100+ ticks in milliseconds.

  Stack & Pinned Versions (verified 2026-10-29 — latest stable & CVE-patched releases, bump deliberately):
  - Node.js LTS: 24.22.2 'Krypton' LTS or 26.13.0 'Lithium' LTS (includes Oct 21, 2026 security patches for CVE-2026-111497, CVE-2026-105482, CVE-2026-105483, CVE-2026-106069, CVE-2026-106074)
  - npm: 12.2.1
  - OpenSpec CLI (`@fission-ai/openspec`): 1.15.0
  - TypeScript (`@typescript/native`): `npm:typescript@7.0.2` (native Go `tsc` binary) + `typescript`: `npm:@typescript/typescript6@6.0.2` (JS AST bridge for `typescript-eslint`)
  - Vite: 8.3.5
  - Vitest: 5.0.5
  - ESLint: 10.13.0 (`@eslint/js`: 10.0.1, `typescript-eslint`: 8.72.1, `eslint-config-prettier`: 10.1.8, `minimatch` override: 11.0.4)
  - Prettier: 3.9.10
  - Husky: 9.1.7 + `lint-staged`: 17.6.0
  - Zod (`zod`): 4.6.7
  - Three.js (`three`): 0.186.1 (`@types/three`: 0.186.0)
  - Hugging Face Transformers (`@huggingface/transformers`): 4.3.2
  - Node types (`@types/node`): 24.19.2

  Planned Atomic Change Sequence (Living Roadmap — subject to revision as DESIGN_NOTES.md evolves):
  - All future changes in this sequence are indicative and designed to accommodate ongoing design notes, new mechanics, or reprioritization between changes without structural rework:
  1. 01-clean-scaffold-and-verify          — Toolchain, Clean Architecture boundary test, SeededRandom, StateSliceKey, /verify [archived]
  1a. 01a-eslint-prettier-and-hooks        — Prettier format-on-save, ESLint flat config (TS 7 side-by-side), Husky + lint-staged [archived]
  2. 02-telemetry-saves-and-debug-skill    — NDJSON session logger, rolling compactor, Vite disk middleware, multi-session Save/Load, uplift-debug skill [archived]
  3. 03-modular-registries-and-kinematics  — Epoch-agnostic module registries (Offices/Pretexts, 3 Illicit Fund Modes & Pressure Stocks, Inertia Pillars, Rivals, Butterfly/Martyrdom/Crises, Async Mail, Emergencies, Orbit/Delta), WorldEffect reducer, 60Hz kinematics, Dual-Ledger CivilizationLegacyState [planned — revisable]
  4. 04-third-person-camera-and-inspector  — Pure RenderFrameBuilder, Three.js 60 FPS stage-paint chiaroscuro renderer, volume-aware 3rd-person fixed-orientation tracking camera, Debug Mode (pause, free-cam de-anchor, floating state cards) [planned — revisable]
  5. 05-live-npc-steering-and-world-stage  — 60 FPS NPC waypoint/outdoor steering, doors/props, 2D spatial hash grid, Highglass Hold indoor/outdoor stage & Player Chambers [planned — revisable]
  6. 06-utility-ai-rivals-and-wider-world  — Hysteresis Utility AI, Inertia Pillars & Leverage Chains, Rival Alien Operatives (Tithe, Quiet, Reciprocal), Braided Butterfly/Martyrdom/Crisis threads, The Writing Desk, Wider World Overview, plus lightweight deterministic Utility AI eval benchmark harness [planned — revisable]
  7. 07-tactical-dialogue-and-voices       — Dialogue interruption, Role Pretexts & Fund spending, Culture Trio AdvisoryDuels (The Ending vs The Lamp with clause omission), distinct NPC voices, ConversationHistory, plus voice-register & anti-LLM-slop eval checks [planned — revisable]
  8. 08-local-onnx-hybrid-intent           — Local MiniLM-L6-v2 setup script, 3-stage lexical + Web Worker ONNX free-text parser with full AI reasoning telemetry, plus lightweight AI/NLP Eval Testing Framework (golden intent/negation/role dataset, top-1/top-3 accuracy & latency benchmarks) [planned — revisable]
  9. 09-orbital-mechanics-weather-and-gate — Orbital pass cycle + Slingshot/Burn Delta, Weather Modification & Omen Ledger, Emergency State set-pieces, Psychohistory Forecast, Dual-Ledger Era 1 Transition Gate [planned — revisable]

  Evolving Design & Configuration Flexibility (standing directive):
  - `DESIGN_NOTES.md` and `openspec/config.yaml` are living documents. Before proposing any new change, always check `DESIGN_NOTES.md` for new ideas, adjustments, or intermediate changes (like `01a`, `02a`, etc.), and keep all registries and configuration data-driven and epoch-agnostic so mechanics, camera parameters, tick rates, and content sub-types can be tuned, swapped, or carried into future Epochs at any point.

  Atomic Task & Commit Strategy (standing directive — "1 Task = 1 Verified Deliverable Commit"):
  - Every OpenSpec change MUST break `tasks.md` into 4 to 6 small, self-contained tasks.
  - Each task MUST touch at most 1-3 source files plus its corresponding test file, compile cleanly, pass `npm run verify`, and map 1:1 to a single Conventional Commit.

  Review Gates (standing directive — do not skip):
  - Post-Propose 2-Subagent Spec Audit Gate (at the end of EVERY /opsx-propose phase, before /opsx-apply):
      After creating proposal.md, specs/*, design.md, and tasks.md, launch a pair of parallel subagents (using Composer 2.5 Fast or Grok 4.7 High Fast) to audit the change artifacts and propose improvements:
      1. Subagent A — Architecture, Adversarial, Determinism & Hardware Audit: Verify Clean Architecture inward layer placement, epoch-agnostic plug-and-play contracts (zero feudal hardcoding in domain), concurrency/immutability/determinism, zero external APIs, and 2019 Intel Mac 60 FPS / <5s verify budgets.
      2. Subagent B — Spec Completeness, DESIGN_NOTES.md Alignment & Task Atomicity Audit: Verify testable WHEN/THEN scenarios (including negative/corruption cases), alignment with DESIGN_NOTES.md and openspec/config.yaml, and confirm tasks.md has 4-6 atomic tasks (1-3 files each) ordered inward-out so every intermediate commit compiles and passes npm run verify.
      Double-check findings, fold verified improvements into the change artifacts, and re-run `openspec validate "<change>" --strict`.
  - Pre-Commit Short Self-Review (before EVERY commit):
      Before running `git commit`, inspect `git diff --staged` and perform a brief self-review checking: (1) strict task scope (no unrelated files), (2) Clean Architecture inward imports and zero implicit/explicit `any`, (3) deterministic `SeededRandom` usage and immutable state transitions, and (4) edge-case coverage in the accompanying test.
  - Post-Change 5-Subagent Review Gate (after EVERY change is delivered, before archiving):
      Once all tasks in a change are marked complete, launch 5 parallel review subagents (using Composer 2.5 Fast or Grok 4.7 High Fast) to audit the delivered change across five axes:
      1. Adversarial Review (edge cases, failure modes, concurrency/race conditions, invalid inputs)
      2. Code Adherence & Architecture Review (layer boundaries, zero-`any`, plug-and-play modularity, OpenSpec spec compliance, hierarchical `README.md`/`AGENTS.md` completeness)
      3. Performance Review (2019 Intel Core i7 16GB RAM budget, 60 FPS frame budget, memory allocation/cloning cost, algorithmic complexity)
      4. Testing Review (assertion quality, missing boundary/negative tests, determinism, test execution speed)
      5. Logic & Simulation Integrity Review (mathematical/bitwise correctness, state-transition invariants, off-by-one or reducer bugs)
      Double-check the subagents' findings against the codebase, fix any verified issues in an atomic commit, and re-run `npm run verify`.

  Hierarchical Documentation & Agent Guidance (standing directive — do not skip):
  - Agent Skills Location Rule: All project agent skills MUST live under `.agents/skills/<skill-name>/SKILL.md` and NEVER under `.cursor/skills/` (enforced by `tests/architecture/layer_boundaries.test.ts`).
  - Maintain a two-tier documentation and agent-instruction hierarchy across the repository:
      1. Root `README.md`: High-level project overview, hardware/offline constraints, pinned dependency & CVE manifest, running/verification instructions, and a Directory Map linking to each section's `README.md`.
      2. Root `AGENTS.md`: Global agent workflow, `/verify` loop, atomic commit policy, layer overview, and an Agent Map linking to each section's `AGENTS.md`.
      3. Per-Section `README.md` & `AGENTS.md`: Every major codebase section (`src/domain/`, `src/application/`, `src/infrastructure/`, `src/content/`, `src/interfaces/`, and `tests/`) MUST maintain its own `README.md` (human-facing responsibilities, contracts, and module inventory) and `AGENTS.md` (agent-facing guardrails, allowed/forbidden imports, step-by-step extension recipes for plugins/content, and test patterns).
  - `tests/architecture/layer_boundaries.test.ts` MUST verify that root `README.md` and `AGENTS.md` exist and link to all section `README.md` and `AGENTS.md` files, and that every major section contains both files.
  - Whenever a change adds or modifies modules in a section, its final task MUST update the corresponding section's `README.md` and `AGENTS.md` (and root index links if new sections were added).

rules:
  proposal:
    - "Before proposing a change, review the project's README.md, AGENTS.md, and DESIGN_NOTES.md to ensure consistency with project scope, context, and design notes (or propose updates to DESIGN_NOTES.md if needed)"
    - "Before proposing a change, review the project's pinned-versions table, planned atomic change sequence, hierarchical documentation rules, and review gates"
    - "Include a Non-goals section to keep the change small and atomic"
    - "State dependencies on prior changes in the change sequence"
    - "Explicitly state that runtime and tests require zero external API keys or cloud inference"
    - "Describe how new modules plug into epoch-agnostic registries without modifying core domain loop code or hardcoding feudal-only assumptions"
  specs:
    - "Specify observable domain, simulation, telemetry, or rendering behavior using testable WHEN/THEN scenarios"
    - "Enforce inward Clean Architecture boundaries, strict TypeScript (no implicit or explicit any), and deterministic SeededRandom behavior where applicable"
  design:
    - "Include the pinned-versions table verified on 2026-10-29 (including CVE-patched runtime/package versions)"
    - "Document layer placement (domain, application, infrastructure, interfaces, content) for every new module"
    - "Ensure 3D presentation data (WorldSceneBlueprint) never leaks into src/domain/"
    - "Detail verification commands and headless testing strategy (no WebGL or 23MB ONNX load required in fast unit tests)"
    - "Specify which section README.md and AGENTS.md files are created or updated by the change"
  tasks:
    - "Limit each change to 4-6 atomic tasks achievable within a single session"
    - "Enforce the 1 Task = 1 Verified Commit rule where every task checkbox includes an explicit Verify command and a Commit Conventional Commit message"
    - "Order tasks inward-out (domain -> application -> content/infrastructure/interfaces -> docs/verify) so every intermediate commit compiles and passes npm run verify"
    - "End each change with a documentation, verification, and 5-subagent review task (adversarial, code adherence, performance, testing, logic) that updates root and per-section README.md and AGENTS.md files"
    - "After creating tasks.md and completing all planning artifacts, run the mandatory Post-Propose 2-Subagent Spec Audit (Architecture/Adversarial/Hardware + Spec/DESIGN_NOTES/Task-Atomicity) and fold verified improvements into the artifacts before starting /opsx-apply"

operations:
  propose:
    guidance:
      - "Before proposing a change, review the project's DESIGN_NOTES.md to ensure the change is consistent with the project's design notes or propose changes to the design notes if necessary"
      - "Before proposing a change, review the project's planned atomic change sequence to ensure the change is consistent with the project's planned atomic change sequence or propose changes to the planned atomic change sequence if necessary"
      - "Before proposing a change, review the project's hierarchical documentation rules to ensure the change is consistent with the project's hierarchical documentation rules or propose changes to the hierarchical documentation rules if necessary"
      - "Before proposing a change, review the project's review gates to ensure the change is consistent with the project's review gates or propose changes to the review gates if necessary"
      - "Before proposing a change, review the project's operations to ensure the change is consistent with the project's operations or propose changes to the operations if necessary"
      - "After proposing a change and creating all planning artifacts, run a pair of parallel subagents (using Composer 2.5 Fast or Grok 4.7 High Fast) to audit: (1) Architecture, Adversarial Edge-Cases, Determinism & Hardware Budget, and (2) Spec Completeness, DESIGN_NOTES.md Alignment & Task Atomicity (inward-out ordering, 1 task = 1 green commit), and fold verified improvements into the artifacts before /opsx-apply"
  apply:
    guidance:
      - "Execute one task at a time by implementing the task, running its Verify command and npm run verify, performing a short pre-commit self-review of git diff --staged, then pause to allow user to review changes"
      - "create an atomic git commit with a conventional commit message, and mark it - [x] in tasks.md before starting the next task"
      - "Never weaken architecture boundary tests, never use implicit or explicit any, and never use raw Math.random() in src/domain/"
      - "Keep per-section README.md and AGENTS.md files in sync with the modules and conventions introduced in that section"
      - "After all tasks in a change are delivered, run the mandatory 5-subagent review (adversarial, code adherence, performance, testing, logic)on the commits in the change, double-check their findings, and commit any verified fixes before concluding"
  archive:
    guidance:
      - "Confirm npm run verify passes, the 5-subagent post-change review has been completed and addressed, and all task commits are clean before archiving"
      - "Confirm root and per-section README.md and AGENTS.md files accurately reflect the completed change before archiving"
