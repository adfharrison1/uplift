schema: spec-driven

context: |
  Project: Uplift (personal immersive simulation game to share locally with friends — not a commercial cloud product).

  Concept & Setting:
  - Inspired by Iain M. Banks' Culture novels (*Inversions*, *Matter*, *Use of Weapons* / Special Circumstances) and Fred Saberhagen's *Brother Assassin*.
  - The player is a covert agent implanted into a pre-industrial/feudal society (Era 1: Highglass Hold) with the goal of uplifting the civilization toward a cooperative, scientific post-scarcity future without letting seeded knowledge be weaponized into tyranny or exposing off-world interference.
  - Each playable slice represents a distinct historical age (Generation/Epoch Jump). Advancing exports a `CivilizationLegacyState` snapshot carrying positive achievements, negative civilizational scars (`InheritedTrait[]`), doctrinal rifts, and institutional character lineage mutations (`lineageId`) into the next age.

  Visual Style & Camera Architecture:
  - 3rd-Person Fixed-Orientation Tracking Camera (*Final Fantasy VII* / *Disco Elysium* / *Inside* style): elevated three-quarter tracking view outdoors and dramatic fixed/tracking camera framing indoors, enabling large outdoor/indoor spaces and large NPC crowds at 60 FPS on a 2019 Intel Mac.
  - Dark, serious, atmospheric visual style (chiaroscuro torch/forge lighting, muted stone/iron/mud palettes, weather particles, grounded proportions).
  - In-Game Debug Mode (`F3` / backtick): pauses 60Hz kinematics and background cognitive ticks, de-anchors the camera for free movement across the frozen world, and renders floating state inspector overlays over targeted NPCs and props.

  Hardware & Local-Only Constraints (non-negotiable):
  - Target baseline hardware: 2019 Intel Core i7 MacBook Pro, 16GB RAM (macOS / cross-platform browser & desktop).
  - 100% local execution after `git clone`, `npm install`, and `npm run setup-models`.
  - ZERO external API keys, ZERO paid tokens, and ZERO cloud LLM/inference calls in runtime or tests.
  - Local NLP uses a 3-stage hybrid pipeline:
      1. Deterministic Lexical & Pragmatic Extractor (<1ms: negation/prohibition polarity, speaker-target roles, speech act).
      2. Local ONNX Embedding Worker (`@huggingface/transformers` running quantized `Xenova/all-MiniLM-L6-v2`, ~23MB cached in `./public/models/`).
      3. Intent Combiner + Anti-LLM-Speak Period-Voice Composer (grounded strictly in NPC epistemic memory, drives, attitude, and period voice register — plus sassy Ship Mind and prim Drone personas).

  Telemetry, Logging, Compaction & Multi-Session Save/Load (non-negotiable):
  - Every event (player, NPC, rival operative, orbital, system) and every AI action (input, output, utility/NLP reasoning) MUST be logged to `./logs/current-session.jsonl` (structured NDJSON via Vite local middleware / Node FS) with `timestampIso`, `elapsedSessionMs`, `worldTick`, `level` (`info` | `warn` | `error` | `crash`), `actorId`, `acteeId`, `action`, `inputs`, `effects`, and `reasoning`.
  - Only the latest session log is retained on new session start, and a Rolling Compactor compacts older time windows into `./logs/current-session.compacted.jsonl` (collapsing repetitive `info` routines while preserving 100% of `warn`, `error`, `crash`, player, rival, and AI reasoning events).
  - A dedicated `.cursor/skills/uplift-debug/SKILL.md` and `npm run logs:query` CLI assist agents in querying logs and tracing bugs.
  - Multi-session Save/Load persists named session snapshots under `./saves/`.

  Code Architecture (standing directive — do not skip):
  - Clean Architecture layering with strict inward dependency direction:
      interfaces (three, hud, composition, cli) -> application -> domain
      infrastructure (onnx worker, telemetry logger/compactor, save repository) -> domain
      content (eras, characters, behaviors, worlds, mechanics) -> domain (for logic/topology) or interfaces/three (for 3D scene blueprints only)
      domain MUST NOT import application, infrastructure, interfaces, content packs, `three`, `@huggingface/transformers`, or DOM/WebGL APIs.
  - Pure Reducer & Typed Plugin State:
      Behaviors and mechanics never mutate `WorldState` in place; they return `WorldEffect[]` applied by a deterministic reducer.
      Custom module state MUST use typed `StateSliceKey<T>` descriptors, never untyped `Record<string, any>`.
  - Strict TypeScript, ESLint, Prettier & Zero `any` Policy (non-negotiable):
      `tsconfig.json` MUST enforce `"strict": true`, `"noImplicitAny": true`, `"strictNullChecks": true`, `"noUncheckedIndexedAccess": true`, `"exactOptionalPropertyTypes": true`, and `"noImplicitOverride": true`.
      Both implicit `any` and explicit `any` (`: any`, `as any`, `<any>`, `any[]`, `Record<string, any>`) are strictly forbidden across `src/` and `tests/` and enforced by both ESLint (`@typescript-eslint/no-explicit-any`) and `tests/architecture/layer_boundaries.test.ts` during `npm run verify`.
      Prettier formats on save (`.vscode/settings.json`), and Husky + `lint-staged` run Prettier and ESLint on every `git commit`.
  - Determinism:
      `Math.random()` and `Date.now()` are forbidden inside `src/domain/` and `src/content/`. All simulation randomness MUST use the injected `SeededRandom` (Xorshift32) instance.

  Plug-and-Play Modularity, World Mechanics & Scalable Entity Tiers:
  - Core engine (`src/domain/`, `src/application/`) contains ZERO hardcoded characters, rooms, behaviors, or lore. All game content and sub-types register through declarative module contracts wired in `src/interfaces/composition/` so any mechanic or sub-type can be added, removed, or updated independently:
      - Characters (`CharacterBlueprint`): 3 tiers (`utility_schemer` Tier 1, `role_routine` Tier 2, `ambient_crowd` Tier 3) with `lineageId`, distinct attitude/voice profiles, and `inertia` weighting.
      - Rival Spacefaring Operatives (`RivalOperativeBlueprint`): Autonomous off-world agents from competing spacefaring civilizations whose effects propagate through the local and wider world and can spoof or be detected via the Wider World Overview.
      - Player Roles & Groundside Funds (`RoleBlueprint` & `FundsEconomyModule`): Era-appropriate roles (with rank progression and physical Chambers/Office) providing legitimate funds vs orbital-inserted illegitimate funds (which carry discovery and local economic inflation penalties).
      - Wider World Overview & Async Correspondence (`WorldOverviewModule` & `MessageTransitQueue`): News, rumors, and time-lagged correspondence (horse messenger -> telegraph -> email) to off-stage core NPCs who react according to their live state and inertia.
      - Inertia Weighting, Slow-Burn Butterfly Threads & Crises (`TrajectoryThreadModule`): Influence difficulty scaled by target inertia, role leverage, and prior intel; slow-building butterfly threads, religious martyrdom/succession rules, and crises (wars, plagues, economic shocks) that can accelerate tech if managed or devastate the civ if unchecked.
      - Emergency States (`EmergencyStateModule`): Temporarily pauses routine traits and activates crisis-specific traits, rumors, and resolution mechanics before normal play resumes.
      - Orbital Mechanics & Weather Modification (`OrbitalPassModule` & `WeatherControlModule`): Ship pass position (`zenith`, `horizon`, `occluded`) gating orbital abilities (recon, bullion insertion, localized weather modification with overuse penalties).

  Real-Time 60 FPS Experience vs Background Cognitive Ticks:
  - Everything visible to the player (player movement, Tier 1-3 NPC walking/steering at ~1.4 m/s, body/head rotation, swinging doors, hovering drones, weather particles) runs continuously at 60 FPS (`stepKinematics(dt)`).
  - Perception & arrival pulses run every ~250ms (line-of-sight, acoustic earshot, waypoint arrival events).
  - Cognitive & macro-world ticks run every ~8-12s in the background (Utility AI with +0.15 hysteresis commitment bonus, rumor decay, message transit, orbital pass movement), assigning new target paths without ever teleporting or freezing physical entities.

  Stack & Pinned Versions (verified 2026-10-29 — latest stable & CVE-patched releases, bump deliberately):
  - Node.js LTS: 24.22.2 'Krypton' LTS or 26.13.0 'Lithium' LTS (includes Oct 21, 2026 security patches for CVE-2026-111497, CVE-2026-105482, CVE-2026-105483, CVE-2026-106069, CVE-2026-106074)
  - npm: 12.2.1
  - OpenSpec CLI (`@fission-ai/openspec`): 1.15.0
  - TypeScript (`@typescript/native`): `npm:typescript@7.0.2` (native Go `tsc` binary) + `typescript`: `npm:@typescript/typescript6@6.0.2` (JS AST bridge for `typescript-eslint`)
  - Vite: 8.3.5
  - Vitest: 5.0.5
  - ESLint: 10.13.0 (`@eslint/js`: 10.0.1, `typescript-eslint`: 8.72.1, `eslint-config-prettier`: 10.1.8, `minimatch` override: 11.0.4)
  - Prettier: 3.9.10
  - Husky: 9.1.7 + `lint-staged`: 17.6.0
  - Three.js (`three`): 0.186.1 (`@types/three`: 0.186.0)
  - Hugging Face Transformers (`@huggingface/transformers`): 4.3.2
  - Node types (`@types/node`): 24.19.2

  Planned Atomic Change Sequence (Living Roadmap — subject to revision as DESIGN_NOTES.md evolves):
  - All future changes in this sequence are indicative and designed to accommodate ongoing design notes, new mechanics, or reprioritization between changes without structural rework:
  1. 01-clean-scaffold-and-verify          — Toolchain, Clean Architecture boundary test, SeededRandom, StateSliceKey, /verify [archived]
  1a. 01a-eslint-prettier-and-hooks        — Prettier format-on-save, ESLint flat config (TS 7 side-by-side), Husky + lint-staged [in progress]
  2. 02-telemetry-saves-and-debug-skill    — NDJSON session logger, rolling compactor, Vite disk middleware, multi-session Save/Load, uplift-debug skill [planned — revisable]
  3. 03-modular-registries-and-kinematics  — Module registries (Roles, Funds, Rivals, Inertia, Butterfly/Crises, Async Mail, Emergencies, Orbit), WorldEffect reducer, 60Hz kinematics, CivilizationLegacyState [planned — revisable]
  4. 04-third-person-camera-and-inspector  — Pure RenderFrameBuilder, Three.js 60 FPS dark atmospheric renderer, 3rd-person fixed-orientation tracking camera, Debug Mode (pause, free-cam de-anchor, floating state cards) [planned — revisable]
  5. 05-live-npc-steering-and-world-stage  — 60 FPS NPC waypoint/outdoor steering, doors/props, 2D spatial hash grid, Highglass Hold indoor/outdoor stage & Player Chambers [planned — revisable]
  6. 06-utility-ai-rivals-and-wider-world  — Hysteresis Utility AI, Inertia Weighting, Rival Alien Operatives, Butterfly/Crisis/Martyrdom threads, Async Correspondence, Wider World Overview [planned — revisable]
  7. 07-tactical-dialogue-and-voices       — Dialogue interruption, covert actions, Legit/Illegit funds, Sassy Ship Mind / Prim Drone / distinct NPC voices, ConversationHistory [planned — revisable]
  8. 08-local-onnx-hybrid-intent           — Local MiniLM-L6-v2 setup script, 3-stage lexical + Web Worker ONNX free-text parser with full AI reasoning telemetry [planned — revisable]
  9. 09-orbital-mechanics-weather-and-gate — Orbital pass cycle, Weather Modification, Deep Scan/Bullion drop, Emergency State resolution, Psychohistory Forecast, Era 1 gate [planned — revisable]

  Evolving Design & Configuration Flexibility (standing directive):
  - `DESIGN_NOTES.md` and `openspec/config.yaml` are living documents. Before proposing any new change, always check `DESIGN_NOTES.md` for new ideas, adjustments, or intermediate changes (like `01a`, `02a`, etc.), and keep all registries and configuration data-driven so mechanics, camera parameters, tick rates, and content sub-types can be tuned or swapped at any point.

  Atomic Task & Commit Strategy (standing directive — "1 Task = 1 Verified Deliverable Commit"):
  - Every OpenSpec change MUST break `tasks.md` into 4 to 6 small, self-contained tasks.
  - Each task MUST touch at most 1-3 source files plus its corresponding test file, compile cleanly, pass `npm run verify`, and map 1:1 to a single Conventional Commit.

  Review Gates (standing directive — do not skip):
  - Pre-Commit Short Self-Review (before EVERY commit):
      Before running `git commit`, inspect `git diff --staged` and perform a brief self-review checking: (1) strict task scope (no unrelated files), (2) Clean Architecture inward imports and zero implicit/explicit `any`, (3) deterministic `SeededRandom` usage and immutable state transitions, and (4) edge-case coverage in the accompanying test.
  - Post-Change 5-Subagent Review Gate (after EVERY change is delivered, before archiving):
      Once all tasks in a change are marked complete, launch 5 parallel review subagents (using Claude 4.5 Haiku Thinking) to audit the delivered change across five axes:
      1. Adversarial Review (edge cases, failure modes, concurrency/race conditions, invalid inputs)
      2. Code Adherence & Architecture Review (layer boundaries, zero-`any`, plug-and-play modularity, OpenSpec spec compliance, hierarchical `README.md`/`AGENTS.md` completeness)
      3. Performance Review (2019 Intel Core i7 16GB RAM budget, 60 FPS frame budget, memory allocation/cloning cost, algorithmic complexity)
      4. Testing Review (assertion quality, missing boundary/negative tests, determinism, test execution speed)
      5. Logic & Simulation Integrity Review (mathematical/bitwise correctness, state-transition invariants, off-by-one or reducer bugs)
      Double-check the subagents' findings against the codebase, fix any verified issues in an atomic commit, and re-run `npm run verify`.

  Hierarchical Documentation & Agent Guidance (standing directive — do not skip):
  - Maintain a two-tier documentation and agent-instruction hierarchy across the repository:
      1. Root `README.md`: High-level project overview, hardware/offline constraints, pinned dependency & CVE manifest, running/verification instructions, and a Directory Map linking to each section's `README.md`.
      2. Root `AGENTS.md`: Global agent workflow, `/verify` loop, atomic commit policy, layer overview, and an Agent Map linking to each section's `AGENTS.md`.
      3. Per-Section `README.md` & `AGENTS.md`: Every major codebase section (`src/domain/`, `src/application/`, `src/infrastructure/`, `src/content/`, `src/interfaces/`, and `tests/`) MUST maintain its own `README.md` (human-facing responsibilities, contracts, and module inventory) and `AGENTS.md` (agent-facing guardrails, allowed/forbidden imports, step-by-step extension recipes for plugins/content, and test patterns).
  - `tests/architecture/layer_boundaries.test.ts` MUST verify that root `README.md` and `AGENTS.md` exist and link to all section `README.md` and `AGENTS.md` files, and that every major section contains both files.
  - Whenever a change adds or modifies modules in a section, its final task MUST update the corresponding section's `README.md` and `AGENTS.md` (and root index links if new sections were added).

rules:
  proposal:
    - "Include a Non-goals section to keep the change small and atomic"
    - "State dependencies on prior changes in the change sequence"
    - "Explicitly state that runtime and tests require zero external API keys or cloud inference"
    - "Describe how new modules plug into registries without modifying core domain loop code"
  specs:
    - "Specify observable domain, simulation, telemetry, or rendering behavior using testable WHEN/THEN scenarios"
    - "Enforce inward Clean Architecture boundaries, strict TypeScript (no implicit or explicit any), and deterministic SeededRandom behavior where applicable"
  design:
    - "Include the pinned-versions table verified on 2026-10-29 (including CVE-patched runtime/package versions)"
    - "Document layer placement (domain, application, infrastructure, interfaces, content) for every new module"
    - "Ensure 3D presentation data (WorldSceneBlueprint) never leaks into src/domain/"
    - "Detail verification commands and headless testing strategy (no WebGL or 23MB ONNX load required in fast unit tests)"
    - "Specify which section README.md and AGENTS.md files are created or updated by the change"
  tasks:
    - "Limit each change to 4-6 atomic tasks achievable within a single session"
    - "Enforce the 1 Task = 1 Verified Commit rule where every task checkbox includes an explicit Verify command and a Commit Conventional Commit message"
    - "Order tasks inward-out (domain -> application -> content/infrastructure/interfaces -> docs/verify) so every intermediate commit compiles and passes npm run verify"
    - "End each change with a documentation, verification, and 5-subagent review task (adversarial, code adherence, performance, testing, logic) that updates root and per-section README.md and AGENTS.md files"

operations:
  propose:
    guidance:
      - "Before proposing a change, review the project's README.md and AGENTS.md to understand the project's scope and context"
      - "Before proposing a change, review the project's pinned-versions table to ensure the change is compatible with the project's dependencies"
      - "Before proposing a change, review the project's planned atomic change sequence to ensure the change is consistent with the project's planned development roadmap"
      - "Before proposing a change, review the project's hierarchical documentation and agent guidance to ensure the change is consistent with the project's documentation and agent guidance"
      - "Before proposing a change, review the project's review gates to ensure the change is consistent with the project's review gates"
      - "Before proposing a change, review the project's task dependencies to ensure the change is consistent with the project's task dependencies"
      - "Before proposing a change, review the project's DESIGN_NOTES.md to ensure the change is consistent with the project's design notes or propose changes to the design notes if necessary"
  apply:
    guidance:
      - "Execute one task at a time by implementing the task, running its Verify command and npm run verify, performing a short pre-commit self-review of git diff --staged, creating its atomic git commit, and marking - [x] in tasks.md before starting the next task"
      - "Never weaken architecture boundary tests, never use implicit or explicit any, and never use raw Math.random() in src/domain/"
      - "Keep per-section README.md and AGENTS.md files in sync with the modules and conventions introduced in that section"
      - "After all tasks in a change are delivered, run the mandatory 5-subagent review (adversarial, code adherence, performance, testing, logic), double-check their findings, and commit any verified fixes before concluding"
  archive:
    guidance:
      - "Confirm npm run verify passes, the 5-subagent post-change review has been completed and addressed, and all task commits are clean before archiving"
      - "Confirm root and per-section README.md and AGENTS.md files accurately reflect the completed change before archiving"
