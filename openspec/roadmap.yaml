    scope: "The runtime loader reads allowlisted, Zod-checked JSON packs and stages through validateLaunch with no TS emission, the stage-lab save gets an end-to-end scenario to its consumer, and kitbash recipes become data with a resolve contract test. Section AGENTS recipes are rewritten to working steps, stale HF/ONNX pointers fixed (the planned local generation worker stays), the lab Save caveat added, fixtures moved out of the content barrel, the pre-P2 plan lines (config line 56) removed, and the docs-truth test extended to section AGENTS with the check that every named *Blueprint exists unless tagged (planned)."
