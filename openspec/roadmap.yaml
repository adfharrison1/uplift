  - id: "cm-act-envelope-and-rolls"
    title: "Core step 1: effect envelope, Act ring, counter-based rolls"
    milestone: M3
    depends_on: ["telemetry-wiring"]
    specs_modified: ["(new) act-ring", "deterministic-simulation-primitives"]
    status: planned
    scope: "Effect envelope {effect, actorId?, causeActId?}, a bounded frozen Act ring slice, BehaviorModule commit, and stateless roll(worldSeed, streamKey, counter) replacing RNG outside WorldState, with stimulus dedupe and priority-aware eviction. Records that the Act log is the gameplay record and telemetry is separate (replay with tracing). Because 30+ changes consume this contract, freeze it only after a throwaway spike with the observation table wired in as a second consumer."
  - id: "cm-observation-notebook"
    title: "Core step 2: Observation table, integer belief, notebook model"
    milestone: M3
    depends_on: ["cm-act-envelope-and-rolls"]
    specs_modified: ["(new) observation", "(new) notebook"]
    status: planned
    scope: "A sparse who-learned-what Observation table with discovery derived per observer, integer noisy-OR belief with reason tags (designed-in misbelief) and a branded BeliefView projector; INV-B is decided before the Observation schema freezes: parents sharing an origin or channel collapse, spoofing is a separate negative term, a parent cap applies, and an order-independence test guards it. A hidden-truth contract test catches omniscient reads of BeliefView. The notebook data model holds facts, suspicions, partial knowledge with open questions, omissions with the omission-referent rule, passive noticing entries and ambient lines heard (core step 5, 07); persistence follows the owner's save policy below. Save policy (owner decision): autosave at watch boundaries plus named manual saves. Loading ANY earlier save is allowed; the owner wants rollback. The notebook (the player's Observations) is part of the save, so loading restores the knowledge state of that moment. Deterministic keyed rolls (roll(worldSeed, streamKey, counter)) mean a reload does not reroll random outcomes unless the player acts differently. An optional ironman mode is parked."
    note: "Save policy (owner decision Q2) is settled and recorded as a gate before this entry: autosave at watch boundaries plus named manual saves, loading any earlier save, notebook part of the save."
