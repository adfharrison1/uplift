    scope: "Refactor under the golden run first: step per locomotion mode behind a context object so commit, steer and presence can be hosted, with a total phase-transition helper and the stale phase fields removed. Then transition events {behaviourId, outcome Arrived|Blocked|Interrupted, residualDt}, spaceId flipping on portal-plane crossing, fixes for door-closes-mid-route dwell and retarget-from-last-waypoint, zero-speed moves rejected, and hop distance in metres, with the waypoint-truncation and blocked-outcome scenarios."
  - id: "pre-05d-renderer-shape"
