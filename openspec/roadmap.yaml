# Living roadmap for Uplift: an ordered array of planned OpenSpec changes.
# Seeded from the root-and-branch review change plan (64 changes in 6 milestones, plus parked entries).
# Order is the intended build order. depends_on is an ordering edge, not always a technical one.
# status: archived | planned | parked | proposed. The roadmap is a direction with room to add and modify.
# Change ids are allowed here and in DESIGN_NOTES.md only; AGENTS.md, README.md, src/ and tests/ never cite them.
# Original ids of untouched changes keep their meaning (07a, 07b, 07c, 07d, 07e, 06a, 06b, 06c, 09a, 05a).
# Retired: 08-local-onnx-hybrid-intent (free-text ONNX parser) is replaced by 08a-timing-spike and 08-generated-text-adapter.
# validated_by lists the later entries that rely on this entry passing.
# status: archived entries are depends_on anchors only; whether a change is archived or active is derived from openspec/changes/.

milestones:
  - id: M1
    name: "Trustworthy foundation"
    outcome: "Docs say what is true, the gates exist, saves round-trip, and a golden seeded run hashes identically twice."
  - id: M2
    name: "Walkable, usable room"
    outcome: "Walk a character around a room with footsteps, bump props, press Space to use things, open menus and change settings."
  - id: M3
    name: "Core model alive"
    outcome: "Spend watch time, act, and see NPCs, beliefs and pressure shift in a headless run and in a crowd room, with telemetry visible."
  - id: M4
    name: "Talk and notebook"
    outcome: "Hold a paged, menu-driven conversation with bubbles and lace page, then read what you learned in the notebook; eval:ai replays it."
  - id: M5
    name: "Vertical slice"
    outcome: "Play one Epoch 1 thread from first clue to a stub end card; the go/no-go point for everything after."
  - id: M6
    name: "Breadth"
    outcome: "Rivals, overview, generated text, advisors, audio lab, Delta/emergency and crew handoff across epochs, ending in a finished Epoch 1."

