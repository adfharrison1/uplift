    scope: "hashWorldState and src/application/headless/runScenario drive a golden run with shuffled insertion, throwing Math.random and Date stubs, a slice JSON round trip and a PHASES-order test (spec delta replaces raw-dt stepping with the fixed step). One ESLint determinism block covers domain, non-scene content and application, bans node:*, require and non-literal import(), and closes the layer-test blind spots."
