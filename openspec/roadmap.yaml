  - id: "hx-ops-safety"
    title: "Hardening 0: guarded bridge, logger rotation, parallel verify"
    milestone: M1
    depends_on: ["05c-play-shell"]
    specs_modified: ["multi-session-saves", "stage-inspector", "session-telemetry-and-compaction", "clean-architecture-and-quality-gate"]
    status: planned
    scope: "Runs first in the whole plan because the bridge CSRF was reproduced and the fix is independent of everything else. One guarded write-route helper (Origin allow-list, Sec-Fetch-Site, Content-Type, per-run token, size cap that destroys the stream, realpath containment) with explicit server.cors and a real http middleware test on 127.0.0.1:0, plus the logger rotating the prior session into logs/prev instead of truncating it (spec delta replaces the requirement that the prior log SHALL be replaced). Then verify runs format, lint, typecheck and vitest in parallel with buffered one-line PASS/FAIL, keeps verify:serial, deletes the prose-pinning arch tests and runs verify in pre-commit, with the unmeasured under-5-seconds clause replaced by a measured budget."
  - id: "docs-spine-and-roadmap"
    title: "Docs: rules spine, system graph, roadmap.yaml"
    milestone: M1
    depends_on: ["hx-ops-safety"]
    specs_modified: ["(none: doc-only)", "(new) roadmap-graph"]
    status: planned
    scope: "Doc-only, anchored on quoted passages not line numbers. DESIGN_NOTES.md gets the index, pillars P1-P5, the Where-facts-live owner table, a section status index (this change writes the index only; heading markers are written once, by the amendment that touches each section), the numbered 8-rule spine, minute/session/epoch cycles, the clock decision record, the Leverage Chain definition with the owner wording kept, the 7-primitive system graph with economy hubs, an emergency cardinality and scope note, one pause/lab definition (player pause sets the single domain freeze bit: time freezes, effects still reduce and return outcomes; lab mode is a PlaySession flag that also holds the bit; free-cam keys gate on lab mode), the owner's save-policy decision (autosave at watch boundaries plus named manual saves; loading any earlier save is allowed and restores that save's notebook), the INV-1 verdicts (INV-A to INV-F), a reserved tellProfile note, the section 9 amendment (tone blips are not a synthesised voice), the past-advisor cameo as a design-note candidate only, and the S2-04 edits retiring free-text and ONNX wording. It also moves the planned camera, play-shell and core-model blocks out of config.yaml into DESIGN_NOTES with a diff proving nothing is lost, writes notes/inbox.md, triages the half-integrated 8 Nov dump into it, adds the ch2 doc shape for review outputs and a dispositions appendix, and adds the planned economy, Regard, storyteller-deck and Writing Desk passages so every change has a doc home. openspec/roadmap.yaml (ordered array, depends_on, specs_modified, status) is seeded from this plan with the original ids restored, plus the roadmap:next script and DAG check, and parked entries each with a revisit trigger (onboarding, DPR/antialiasing, silhouette budget, theme roles, later notebook categories, offline self-play tuning, small classifier spike, INV-D Bayesian network, INV-F exact-inference network, RC2 runtime reranker, dither-fade wall occlusion, merged Tier-3 crowd, compiler-API import scan, Epoch 1 definition of done)."
  - id: "process-gates-and-ledger"
    title: "Process: design-notes skill fix, docs-truth test, gates skill, defect ledger"
    milestone: M1
    depends_on: ["docs-spine-and-roadmap"]
    specs_modified: ["clean-architecture-and-quality-gate", "(new) review-process", "(new) defect-ledger"]
    status: planned
    scope: "Fixes .agents/skills/uplift-design-notes so it writes DESIGN_NOTES, notes/inbox.md and roadmap.yaml and never AGENTS.md; rewrites root AGENTS.md to shipped code only (target about 900 words, test ceiling 1050, no change ids), single-sources versions in package.json, drops CVE ids, and cuts config.yaml context under 1.5k words by whole-block cuts that point to DESIGN_NOTES, only after the no-loss diff from the spine change passes. Creates .agents/skills/uplift-review-gates/SKILL.md with gates G1-G6 (additions only, task-size rule replacing the 4-6 count, retargeting the old Subagent B wording into the skill, consumer scenarios and MODIFIED deltas for contradicted requirements) and adds a tracked openspec/defect-ledger.yaml (id, source, severity, fixing change id; a finding with no fixing change is recorded as parked) whose entries are deleted by an opsx-archive wrapper script, with the skill only pointing at that script. The single docs-truth test lands last so it starts green: it checks root AGENTS.md only (identifiers and scripts resolve, versions match, change ids only in openspec/ and DESIGN_NOTES, status markers resolve to roadmap.yaml, word budgets, numeric facts) and fails on ledger entries naming archived or absent changes; the ledger seed (all severities or majors only) awaits Q3. Ledger seed: every open code defect this review found that has a slotted fixing change, all severities."
  - id: "hx-1-legacy-clamp-seed-scramble"
    title: "Hardening 1+2: legacy clamp, seed scramble"
    milestone: M1
    depends_on: ["hx-ops-safety"]
    specs_modified: ["deterministic-simulation-primitives"]
    status: planned
    scope: "Clamps legacy mutations to [0,1] with a telemetry note (the throw stays in an authoring-time contract test) and adds a splitmix32 seed scramble with a golden-vector test. This is deliberately only the clamp half of S3-14: accumulation is deferred on purpose to 10-registry-swap-and-legacy and sourceScarId to 05b-1, each carried by its own source id so the three pieces sum to the finding. Adds acceptance lines for the frozen-input and RNG golden-value test gaps."
  - id: "hx-slice-store"
    title: "Hardening 3: test builders, share-on-read slice store, typed slice keys"
    milestone: M1
    depends_on: ["hx-1-legacy-clamp-seed-scramble"]
    specs_modified: ["deterministic-simulation-primitives"]
    status: planned
    scope: "Adds tests/support makeRegistry, makeWorldState and makeStageBlueprint, splits the monolithic tests onto them, gives the bridge its first tests, and carries the S3-17 acceptance lines (caps, mid-hop states, dt splits) for later hardening changes. StateSliceStore then freezes on write and shares on read with O(1) append (the default-fallback scenario no longer demands a clone), guarded by frozen-output invariant tests. StateSliceKey gains optional schema/version/migrate and a plain-JSON guard so Map and Set cannot enter a slice."
  - id: "hx-save-integrity"
    title: "Hardening 4: WorldStateCodec, pack identity, id pattern"
    milestone: M1
    depends_on: ["hx-slice-store"]
    specs_modified: ["multi-session-saves"]
    status: planned
    scope: "WorldStateCodec with snapshotVersion, Zod load and a migrations chain replaces the four copies of the world-state field list (the S3-09 field-list half), with a save round-trip scenario. packId/version go on the registry and save envelope with an epoch and pack check on load, recording the decision of one registry per epoch with cameo content only through an explicit import list. One entity-id pattern check at load and at materialize stops a bad id throwing in the render loop, and listSlots reports why a slot is unreadable. This is the cheapest migration to get wrong, so each of the three parts is its own task with a round-trip test."
  - id: "hx-reducer-and-frame-safety"
    title: "Hardening 5: reducer outcomes, pause bit, frame guard"
    milestone: M1
    depends_on: ["hx-save-integrity"]
    specs_modified: ["deterministic-simulation-primitives", "play-shell"]
    status: planned
    scope: "Reducers return applied/rejected with a reason and a throw no longer aborts the batch, kept to at most 3 files per task because it touches every reducer. The player pause sets the single domain freeze bit (time freezes; dispatched effects still reduce and return outcomes), PlaySession.status is recomputed per call, and lab mode becomes a PlaySession flag that also holds the bit with free-cam keys gated on lab mode, not isPaused. A frame try/catch re-arms rAF, and the 05e clause is reworded to no second domain pause flag."
  - id: "hx-fixed-step-tick"
    title: "Hardening 6a: coordinator.tick, fixed step, interpolation seam"
    milestone: M1
    depends_on: ["hx-reducer-and-frame-safety"]
    specs_modified: ["play-shell"]
    status: planned
    scope: "coordinator.tick(dt, commands) with a named phase order separates the roughly seven coordinator jobs, a 1/60 s accumulator with capped catch-up runs it, and PlaySession frame order moves into tick, with test-gap lines for dt splits. The accumulator keeps the previous WorldState and exposes alpha plus a teleport marker so RenderFrameBuilder lerps positions, shortest-arc yaw and the camera focus. The seam is a task of this change, not a separate capability; phase order is the main determinism risk and is pinned by the harness change that follows."
  - id: "hx-determinism-harness"
