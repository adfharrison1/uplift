    depends_on: ["cm-observation-notebook", "audio-minimal"]
    specs_modified: ["(new) instrument-profiles"]
    status: planned
    scope: "This Observation-step change is the single owner of the audibility-tier rule: it replaces the audio-minimal provisional table with the integrated rule, and 05a only consumes it. Instrument data profiles and decay keys replace hard-coded reducer coupling, each visual tell is paired with a non-visual noticing path that writes the passive noticing entry, and diegetic tells are defined for the instruments."
  - id: "cm-presence-and-materialize"
    title: "Core step 3a: presence function and materialize-on-entry"
    milestone: M3
    depends_on: ["cm-instrument-profiles-audibility-tells"]
    specs_modified: ["(new) presence"]
    status: planned
    scope: "A pure (entityId, watch, seed) to placement presence table per watch, materialization on room entry, and WorldBuilder, addressing the three S2-11 blockers: entities start off-stage rather than spawning at a start waypoint, room-second timers are reconciled with watches, and in-flight phases and stimuli resolve deterministically across a watch jump. Per-frame allocation cleanup applies only when a room holds 100+ bodies, and every macro lever must reach the player somehow."
  - id: "cm-presence-render-crowd"
