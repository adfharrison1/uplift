    scope: "validateLaunch(pack, stages, visuals) collects all errors with ids and file hints and folds in the interim shape-id check from the renderer change. defineModuleKind replaces the closed 11-kind registry, the registry gets a ref table (institutionalLineageId ref added, duplicate check dropped), the epoch-agnostic denylist is derived from exported packs and moved to tests/architecture, and an arch test forbids a new kind or effect without content using it."
