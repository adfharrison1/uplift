    summary: SeededRandom.nextInt(2^32) cannot return zero despite its unbiased contract
    source:
      - path: openspec/changes/hx-1-legacy-clamp-seed-scramble/task-5-reviews.md
        anchor: HX1-NEXTINT-01 — pre-existing `nextInt(2^32)` distribution defect
        description: Independent closing logic review confirmed the pre-existing
          unreachable-zero result and future ownership.
      - path: src/domain/core/SeededRandom.ts
        anchor: "public nextInt(maxExclusive: number): number"
        description: The accepted bound includes 2^32, while nextUint32 supplies only
          nonzero samples.
    severity: minor
    status: parked
    fixing_change: cm-act-envelope-and-rolls
    evidence: null
    blocker: null
    revisit_when: Before cm-act-envelope-and-rolls introduces a gameplay caller of
      nextInt or choose, or changes RNG stream semantics.
    parked_reason: No gameplay caller currently uses nextInt or choose; changing
      draw semantics now would alter saved continuation and exceeds this change.
    revision: 1
