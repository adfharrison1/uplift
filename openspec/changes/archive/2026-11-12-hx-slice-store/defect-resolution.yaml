        specs_modified:
          - "(none: doc-only)"
        status: done-by-review
        delivery_ref:
          kind: git
          commit: 0b3d6b1366cf5f16326e1b91471594eb8a58f465
        note: Delivered by the 2026-11 root-and-branch review's Phase 1 doc commits. The
          roadmap:next script and the roadmap DAG check moved to
          process-gates-and-ledger.
        scope: "Doc-only, anchored on quoted passages not line numbers. DESIGN_NOTES.md
          gets the index, pillars P1-P5, the Where-facts-live owner table, a section
          status index (this change writes the index only; heading markers are
          written once, by the amendment that touches each section), the numbered
          8-rule spine, minute/session/epoch cycles, the clock decision record, the
          Leverage Chain definition with the owner wording kept, the 7-primitive
          system graph with economy hubs, an emergency cardinality and scope note,
          one pause/lab definition (player pause sets the single domain freeze bit:
          time freezes, effects still reduce and return outcomes; lab mode is a
          PlaySession flag that also holds the bit; free-cam keys gate on lab mode),
          the owner's save-policy decision (autosave at watch boundaries plus named
          manual saves; loading any earlier save is allowed and restores that save's
          notebook), the INV-1 verdicts (INV-A to INV-F), a reserved tellProfile
          note, the section 9 amendment (tone blips are not a synthesised voice),
          the past-advisor cameo as a design-note candidate only, and the S2-04
          edits retiring free-text and ONNX wording. Config consolidation and its
          no-loss mapping are owned by process-gates-and-ledger; the system sections
          here provide its canonical design destinations. It writes notes/inbox.md,
          triages the half-integrated 8 Nov dump into it, adds the ch2 doc shape for
          review outputs and a dispositions appendix, and adds the planned economy,
          Regard, storyteller-deck and Writing Desk passages so every change has a
          doc home. openspec/roadmap.yaml (ordered array, depends_on,
          specs_modified, status) is seeded from this plan with the original ids
          restored, and parked entries each with a revisit trigger (onboarding,
          DPR/antialiasing, silhouette budget, theme roles, later notebook
          categories, offline self-play tuning, small classifier spike, INV-D
          Bayesian network, INV-F exact-inference network, RC2 runtime reranker,
          dither-fade wall occlusion, merged Tier-3 crowd, compiler-API import scan,
          Epoch 1 definition of done)."
