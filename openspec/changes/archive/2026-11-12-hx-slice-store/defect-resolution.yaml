          openspec/defect-ledger.yaml (id, source, severity, fixing change id; a
          finding with no fixing change is recorded as parked) whose verified
          entries move into durable resolution receipts through a checked archive
          wrapper, with the skill only pointing at that script. The single
          docs-truth test lands last so it starts green: it checks root AGENTS.md
          only (identifiers and scripts resolve, versions match, live change ids
