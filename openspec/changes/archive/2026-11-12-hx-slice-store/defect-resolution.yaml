  roadmap: >
    milestones:
      - id: M1
        name: Trustworthy foundation
        outcome: Docs say what is true, the gates exist, saves round-trip, and a golden
          seeded run hashes identically twice.
      - id: M2
        name: Walkable, usable room
        outcome: Walk a character around a room with footsteps, bump props, press Space
          to use things, open menus and change settings.
      - id: M3
        name: Core model alive
        outcome: Spend watch time, act, and see NPCs, beliefs and pressure shift in a
          headless run and in a crowd room, with telemetry visible.
      - id: M4
        name: Talk and notebook
        outcome: Hold a paged, menu-driven conversation with bubbles and lace page, then
          read what you learned in the notebook; eval:ai replays it.
      - id: M5
        name: Vertical slice
        outcome: Play one Epoch 1 thread with findable inference trails as the go/no-go
          point; a separate follow-up adds the ledger and end card.
      - id: M6
        name: Breadth
        outcome: Rivals, overview, generated text, advisors, audio lab, Delta/emergency
          and crew handoff across epochs, ending in a finished Epoch 1.
